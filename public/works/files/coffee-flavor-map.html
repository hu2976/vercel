<title>世界咖啡风味地图</title>
<style>
:root{
  --ink:#070D0B; --bg:#0A1210; --surf:#101A16; --surf2:#17231D; --surf3:#1E2C25;
  --line:#22312A; --line2:#2E4038;
  --sea:#060D0C; --land:#1E2C25; --land-c:#3B5646; --land-hi:#4E7159;
  --txt:#EAE6DA; --txt2:#9CA9A0; --txt3:#6A7972;
  --gold:#E3AC4C; --gold-d:#8A6A2C;
  --africa:#D4547A; --americas:#E29244; --asia:#74A45F;
  --f-disp:'Futura','Avenir Next Condensed','Trebuchet MS','PingFang SC','Hiragino Sans GB',sans-serif;
  --f-body:'Avenir Next','Avenir','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --panel-w:min(460px,42vw);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:var(--f-body); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;
  text-align:inherit;-webkit-appearance:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:2px}

#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- header ---------- */
header{
  flex:none;display:flex;align-items:center;gap:20px;
  padding:12px 20px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--surf),var(--bg));z-index:30;
}
.brand{display:flex;align-items:baseline;gap:12px;flex:none}
.brand b{font-family:var(--f-body);font-weight:600;font-size:17px;letter-spacing:.06em}
.brand span{font-family:var(--f-disp);font-size:10px;letter-spacing:.28em;color:var(--txt3);text-transform:uppercase}
.crumbs{display:flex;align-items:center;gap:9px;font-size:13px;flex:1;min-width:0;overflow:hidden}
.crumbs button{color:var(--txt2);white-space:nowrap;padding:2px 0;border-bottom:1px solid transparent}
.crumbs button:hover{color:var(--gold);border-bottom-color:var(--gold-d)}
.crumbs .sep{color:var(--txt3);font-size:11px}
.crumbs .cur{color:var(--txt);white-space:nowrap}
.hcount{flex:none;font-family:var(--f-mono);font-size:11px;color:var(--txt3);letter-spacing:.08em}

/* ---------- stage ---------- */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;cursor:default}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--sea)}
.land{fill:var(--land);stroke:#0B1310;stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .45s}
.land.c{fill:var(--land-c)}
.land.on{fill:var(--land-hi)}
.grid line{stroke:rgba(176,208,192,.075);stroke-width:.5;vector-effect:non-scaling-stroke}
.grid line.major{stroke:rgba(176,208,192,.17)}
.trop{stroke:var(--gold);stroke-width:.9;stroke-dasharray:6 4;opacity:.6;vector-effect:non-scaling-stroke;fill:none}
.equator{stroke:var(--gold);stroke-width:.7;stroke-dasharray:1.5 5;opacity:.38;vector-effect:non-scaling-stroke}

/* 洲际热区 */
.zone{cursor:pointer}
.zone rect{fill:transparent;stroke:currentColor;stroke-width:1;stroke-dasharray:3 3;
  opacity:.32;vector-effect:non-scaling-stroke;transition:opacity .25s,fill .25s}
.zone:hover rect{opacity:.85;fill:currentColor;fill-opacity:.07}

#labels{position:absolute;inset:0;pointer-events:none;z-index:10}
.zlab{position:absolute;transform:translate(-2px,-100%);text-align:left;pointer-events:auto;
  cursor:pointer;transition:opacity .35s;white-space:nowrap;z-index:14;padding:12px 30px 9px 4px;
  background:radial-gradient(125% 135% at 4% 55%,rgba(6,13,12,.93) 0%,rgba(6,13,12,.66) 42%,rgba(6,13,12,0) 76%)}
.zlab.bl{transform:translate(-2px,0);
  background:radial-gradient(125% 135% at 4% 45%,rgba(6,13,12,.93) 0%,rgba(6,13,12,.66) 42%,rgba(6,13,12,0) 76%);
  padding:9px 30px 12px 4px}
.zlab .zn{font-family:var(--f-body);font-weight:600;font-size:22px;letter-spacing:.2em;
  text-shadow:0 2px 18px #000,0 0 40px #000}
.zlab .zs{font-family:var(--f-disp);font-size:10px;letter-spacing:.3em;color:var(--txt3);
  text-transform:uppercase;margin-top:5px}
.zlab .zc{font-family:var(--f-mono);font-size:10px;color:var(--txt3);margin-top:6px;letter-spacing:.05em}
.zlab:hover .zn{color:currentColor}

.mk{position:absolute;pointer-events:auto;cursor:pointer;z-index:11}
.mk .dot{position:absolute;left:0;top:0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
  border-radius:50%;background:currentColor;box-shadow:0 0 0 1.5px rgba(8,14,12,.85),0 0 12px currentColor;
  transition:transform .2s}
.mk .nm{position:absolute;left:9px;top:-9px;font-size:12.5px;line-height:1.35;white-space:nowrap;
  color:var(--txt);text-shadow:0 1px 6px #000,0 0 14px #000,0 0 3px #000;
  padding:1px 3px;transition:color .2s}
.mk .nm em{font-style:normal;font-family:var(--f-disp);font-size:9px;letter-spacing:.14em;
  color:var(--txt3);display:block;text-transform:uppercase}
.mk:hover .dot{transform:scale(1.55)}
.mk:hover .nm{color:currentColor}
.mk.sel .dot{transform:scale(1.7)}
.mk.sel:before{content:'';position:absolute;left:0;top:0;width:56px;height:56px;
  margin:-28px 0 0 -28px;border:1px dashed currentColor;border-radius:50%;opacity:.65;
  animation:spin 26s linear infinite}
.mk.sel:after{content:'';position:absolute;left:-34px;top:0;width:68px;height:1px;
  background:linear-gradient(90deg,transparent,currentColor 22%,transparent 34%,transparent 66%,currentColor 78%,transparent);
  opacity:.5}
@keyframes spin{to{transform:rotate(360deg)}}
.mk.sel .nm{color:currentColor;font-weight:600}
.mk.dim{opacity:.22}
.mk.tiny .nm{display:none!important}
.mk.tiny .dot{width:6px;height:6px;margin:-3px 0 0 -3px;box-shadow:0 0 0 1px rgba(6,13,12,.9),0 0 8px currentColor}
.mk.tiny:hover .dot{transform:scale(2)}
.mk.edge{opacity:.72}
.mk.edge .dot{width:7px;height:7px;margin:-3.5px 0 0 -3.5px}
.mk.edge .nm{font-size:11px}
.mk.edge:after{content:'';position:absolute;left:-13px;top:-3px;width:0;height:0;
  border:4px solid transparent;border-right-color:currentColor;opacity:.8}
.mk.flt .dot{box-shadow:0 0 0 1.5px rgba(8,14,12,.85),0 0 18px currentColor,0 0 34px currentColor}

/* ---------- 底部图例 ---------- */
#legend{flex:none;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:9px 20px;border-top:1px solid var(--line);background:var(--surf);z-index:30;font-size:12px}
.lg{display:flex;align-items:center;gap:7px;color:var(--txt2)}
.lg i{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none;
  box-shadow:0 0 9px currentColor}
.lg b{font-weight:600;color:var(--txt)}
.lg s{text-decoration:none;color:var(--txt3);font-size:11px}
.lgsep{width:1px;height:16px;background:var(--line2)}
#taghint{margin-left:auto;font-size:11px;color:var(--txt3);font-family:var(--f-mono);letter-spacing:.04em}

/* 风味筛选条 */
#filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ftag{font-size:11.5px;padding:3px 9px;border:1px solid var(--line2);border-radius:2px;
  color:var(--txt2);letter-spacing:.03em;transition:.18s;white-space:nowrap}
.ftag:hover{border-color:var(--gold-d);color:var(--txt)}
.ftag.on{background:var(--gold);border-color:var(--gold);color:#14100A;font-weight:600}

/* ---------- 详情面板 ---------- */
#panel{
  position:absolute;top:0;right:0;bottom:0;width:var(--panel-w);z-index:40;
  background:linear-gradient(180deg,var(--surf) 0%,var(--bg) 100%);
  border-left:1px solid var(--line2);box-shadow:-24px 0 60px rgba(0,0,0,.55);
  transform:translateX(102%);transition:transform .5s cubic-bezier(.22,.9,.28,1);
  display:flex;flex-direction:column;overflow:hidden;
}
#panel.open{transform:none}
#panel:after{content:'';position:absolute;left:0;right:0;bottom:0;height:52px;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,18,16,0),var(--bg) 78%);
  opacity:0;transition:opacity .3s}
#panel.more:after{opacity:1}
.pclose{position:absolute;top:12px;right:12px;z-index:5;width:32px;height:32px;
  border-radius:50%;background:rgba(8,14,12,.72);backdrop-filter:blur(6px);
  border:1px solid var(--line2);color:var(--txt2);font-size:17px;line-height:1;
  display:grid;place-items:center}
.pclose:hover{color:var(--txt);border-color:var(--gold-d)}
#pbody{overflow-y:auto;overscroll-behavior:contain;flex:1}
#pbody::-webkit-scrollbar{width:9px}
#pbody::-webkit-scrollbar-thumb{background:#3F5A4B;border-radius:9px}
#pbody::-webkit-scrollbar-thumb:hover{background:#547A63}
#pbody::-webkit-scrollbar-track{background:transparent}

.phero{position:relative;aspect-ratio:3/2;background:var(--surf2);overflow:hidden}
.phero img{width:100%;height:100%;object-fit:cover;display:block;
  animation:fade .7s ease both}
@keyframes fade{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.phero:after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,13,11,.15) 0%,rgba(7,13,11,0) 34%,rgba(7,13,11,.9) 100%)}
.pcap{position:absolute;left:16px;right:16px;bottom:11px;z-index:2;font-size:11px;color:var(--txt2);
  display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.pdots{display:flex;gap:5px;flex:none}
.pdots button{width:22px;height:3px;background:rgba(255,255,255,.28);border-radius:2px;transition:.2s}
.pdots button.on{background:var(--gold)}
.ref{display:inline-block;font-size:9.5px;letter-spacing:.1em;padding:1px 5px;border:1px solid var(--line2);
  color:var(--txt3);border-radius:2px;margin-left:6px;vertical-align:1px}

.phead{padding:20px 22px 4px}
.pflag{font-size:22px;line-height:1}
.pttl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pttl h2{margin:0;font-size:27px;font-weight:600;letter-spacing:.03em;line-height:1.2}
.pen{font-family:var(--f-disp);font-size:11px;letter-spacing:.24em;color:var(--gold);
  text-transform:uppercase;margin-top:7px}
.pzone{font-size:12.5px;color:var(--txt2);margin-top:8px}

.pfacts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
  margin:16px 22px 0;border:1px solid var(--line)}
.pfacts div{background:var(--surf);padding:9px 11px}
.pfacts dt{font-family:var(--f-disp);font-size:9px;letter-spacing:.18em;color:var(--txt3);text-transform:uppercase}
.pfacts dd{margin:3px 0 0;font-size:13px;font-family:var(--f-mono);color:var(--txt);letter-spacing:-.01em}

section{padding:22px}
section+section{border-top:1px solid var(--line)}
h3{margin:0 0 13px;font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--gold);
  text-transform:none;display:flex;align-items:center;gap:9px}
h3:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--gold-d),transparent)}
p{margin:0 0 11px}
p:last-child{margin-bottom:0}
.body-t{font-size:14px;color:#D2CFC4;line-height:1.75}

.clim{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.clim div{background:var(--surf2);border:1px solid var(--line);padding:9px 10px}
.clim dt{font-size:10px;color:var(--txt3);letter-spacing:.09em}
.clim dd{margin:4px 0 0;font-family:var(--f-mono);font-size:12.5px;color:var(--txt)}
.soil{background:var(--surf2);border:1px solid var(--line);padding:9px 11px;margin-bottom:14px}
.soil dt{font-size:10px;color:var(--txt3);letter-spacing:.09em}
.soil dd{margin:4px 0 0;font-size:13px;color:#D2CFC4}

.var{background:var(--surf2);border:1px solid var(--line);padding:12px 13px;margin-bottom:9px}
.var:last-child{margin-bottom:0}
.var>b{display:block;font-size:14.5px;font-weight:600;color:var(--txt);letter-spacing:.01em}
.vf{font-size:13px;color:#D2CFC4;margin-top:6px;line-height:1.65}
.vm{margin:11px 0 0;display:grid;gap:8px}
.vm>div{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.vm dt{font-size:10.5px;letter-spacing:.08em;color:var(--gold);line-height:1.7;
  border-right:1px solid var(--line2)}
.vm dd{margin:0;font-size:12.5px;color:var(--txt2);line-height:1.7}
.vn{font-size:11.5px;color:var(--txt3);line-height:1.75;margin:10px 0 0;padding-top:9px;
  border-top:1px dashed var(--line)}
.vn:before{content:"\203B\2002";color:var(--gold-d)}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surf3);
  border:1px solid var(--line2);color:#D2CFC4;cursor:pointer;transition:.16s}
.tag:hover{border-color:currentColor;color:var(--txt)}

.cup{font-size:14px;line-height:1.8;color:#D8D4C8;border-left:2px solid var(--gold-d);
  padding:2px 0 2px 15px;margin-top:14px}

.bars{display:grid;gap:7px;margin-top:15px}
.bar{display:grid;grid-template-columns:44px 1fr 26px;align-items:center;gap:10px;font-size:11.5px}
.bar i{font-style:normal;color:var(--txt2);letter-spacing:.06em}
.bar u{text-decoration:none;height:5px;background:var(--surf3);border-radius:3px;overflow:hidden;display:block}
.bar u b{display:block;height:100%;background:currentColor;border-radius:3px;
  box-shadow:0 0 8px currentColor;transition:width .7s cubic-bezier(.3,1,.4,1)}
.bar em{font-style:normal;font-family:var(--f-mono);font-size:10.5px;color:var(--txt3);text-align:right}

.proc{border:1px solid var(--line);background:var(--surf2);padding:12px 13px;margin-bottom:9px}
.proc:last-child{margin-bottom:0}
.proc header{display:flex;align-items:center;gap:9px;padding:0;border:none;background:none;margin-bottom:6px}
.proc b{font-size:14.5px;font-weight:600}
.lvl{font-size:10px;letter-spacing:.1em;padding:2px 7px;border-radius:2px;
  background:var(--gold);color:#14100A;font-weight:600;flex:none}
.lvl.s{background:transparent;border:1px solid var(--line2);color:var(--txt2);font-weight:400}
.proc p{font-size:12.5px;color:var(--txt2);line-height:1.7;margin:0}

.roast{border:1px solid var(--line);background:var(--surf2);padding:14px}
.roast .rt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.roast .rt b{font-size:16px;font-weight:600;color:var(--gold)}
.roast .rt span{font-family:var(--f-mono);font-size:11.5px;color:var(--txt2)}
.scale{position:relative;height:34px;border-radius:3px;overflow:hidden;
  background:linear-gradient(90deg,#C9B48C 0%,#B9945F 22%,#96683C 45%,#6E4326 68%,#472A1A 86%,#2E1C13 100%)}
.scale .win{position:absolute;top:0;bottom:0;border:2px solid var(--gold);
  box-shadow:0 0 0 9999px rgba(7,13,11,.62),0 0 16px rgba(227,172,76,.5);border-radius:2px}
.scaleax{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:9.5px;
  color:var(--txt3);margin-top:5px;letter-spacing:.04em}
.roast p{font-size:12.5px;color:var(--txt2);line-height:1.7;margin-top:11px}

.credit{font-size:10.5px;color:var(--txt3);line-height:1.6;padding:16px 22px 30px;border-top:1px solid var(--line)}
.credit a{color:var(--txt3);text-decoration:underline;text-underline-offset:2px}
.credit a:hover{color:var(--gold)}

/* ---------- 世界视图的标题卡 ---------- */
#intro{position:absolute;left:32px;bottom:28px;z-index:12;max-width:min(370px,40vw);
  transition:opacity .45s,transform .45s;pointer-events:none}
#intro.hide{opacity:0;transform:translateY(14px)}
#intro h1{margin:0 0 12px;font-size:clamp(26px,3.4vw,40px);font-weight:600;letter-spacing:.04em;
  line-height:1.18;text-wrap:balance;text-shadow:0 3px 30px #000}

  text-transform:uppercase;margin-bottom:14px}

#intro .go{margin-top:14px;font-size:12px;color:var(--txt3);font-family:var(--f-mono);letter-spacing:.06em}

#hud{position:absolute;right:22px;bottom:16px;z-index:13;display:flex;align-items:flex-end;

  pointer-events:none;text-shadow:0 1px 8px #000}
#hud[hidden]{display:none}
#hud.left{left:20px;right:auto}
#hud .sc{display:flex;flex-direction:column;align-items:flex-start;gap:3px}

#zintro[hidden]{display:none}
#zintro.hide{opacity:0;transform:translateY(10px)}
#zintro .zt{font-family:var(--f-disp);font-size:10px;letter-spacing:.3em;text-transform:uppercase;

const REGIONS = [{"id":"yirgacheffe","cn":"耶加雪菲","en":"Yirgacheffe","zone":"盖迪奥区 Gedeo","country":"埃塞俄比亚","iso":"ETH","flag":"🇪🇹","group":"africa","lon":38.2,"lat":6.16,"alt":"1750 – 2200 m","harvest":"10 月 – 次年 1 月","climate":{"rain":"1400 – 1800 mm","temp":"15 – 25 ℃","soil":"深厚红棕色火山灰壤土（Nitisol），微酸、腐殖质厚","text":"东非大裂谷东缘的高地台，常年云雾缭绕、昼夜温差大，咖啡多长在原生林木的天然遮荫下。4–9 月为主雨季，采收期正好落在干燥的 10 月之后，果实得以在树上缓慢成熟——这是耶加雪菲花香与高甜的物理来源。"},"varieties":[{"n":"原生种群 Heirloom（Kurume 型）","f":"茉莉、佛手柑、柠檬皮，茶感细腻","p":"水洗。36–48 小时发酵后清洗晾晒，是把花香做透明的唯一路径；这个种型豆粒小而圆，日晒容易发酵过头压掉清冷感。","r":"极浅～浅焙 · Agtron 85–75，一爆结束前后下豆","note":"Kurume、Wolisho、Dega 是当地对株型的称呼，不是植物学品种；商业上统称 Heirloom（原生种群）。"},{"n":"JARC 74110 / 74112","f":"柑橘骨架明亮，甜感扎实，酸质结构比老种更清楚","p":"水洗最稳。这两个编号本就是为抗炭疽病选育的，豆体均匀、发酵可控，是耶加水洗批次的产量主力。","r":"浅焙 · Agtron 82–74，一爆后发展 30–60 秒"},{"n":"74158","f":"花香略收、甜厚增加，桃与蜂蜜","p":"水洗、日晒都成立。做日晒时甜感明显厚过 74110，是近年精品日晒耶加的常用编号。","r":"浅焙 · Agtron 80–72"}],"tags":["茉莉","佛手柑","柠檬","红茶尾韵","蜂蜜甜"],"cup":"干香就是一整片花田。入口是柠檬与佛手柑的清亮酸，中段浮出茉莉与白桃，尾韵像一杯冷掉的锡兰红茶，干净、悠长、几乎没有杂味。","process":[{"n":"水洗","lvl":"标志","why":"耶加雪菲之所以是耶加雪菲，靠的就是水洗把花香与柑橘酸洗得极度透明。发酵 36–48 h 后清洗晾晒。"},{"n":"日晒","lvl":"推荐","why":"近十年精品日晒批次崛起：草莓、蓝莓、酒渍樱桃，甜度爆炸，但会盖掉一部分茉莉的清冷感。"}],"roast":{"n":"极浅 – 浅焙","range":"Agtron 85 – 75｜一爆结束前后下豆","why":"任何进入二爆前的发展都会把茉莉压成焦糖。留住花香就必须克制，牺牲一点醇厚度换香气。"},"radar":{"acid":5,"body":2,"sweet":4,"aroma":5,"clean":5}},{"id":"sidama","cn":"西达摩","en":"Sidama","zone":"西达马州 Sidama","country":"埃塞俄比亚","iso":"ETH","flag":"🇪🇹","group":"africa","lon":38.62,"lat":6.9,"alt":"1500 – 2200 m","harvest":"10 月 – 次年 1 月","climate":{"rain":"1200 – 1600 mm","temp":"16 – 24 ℃","soil":"火山灰红壤，排水好，有机质含量高","text":"覆盖裂谷东侧一整片起伏高原，海拔跨度大，因此风味谱系比耶加雪菲宽得多。低海拔带更甜厚，Bensa、Bombe 一类高海拔村落则接近甚至超过耶加的花果强度。"},"varieties":[{"n":"原生种群 Heirloom","f":"柑橘、黑莓、可可、坚果甜","p":"日晒是西达摩的看家做法：非洲晾床薄层摊晒 12–18 天、每小时翻动，果胶糖分完整渗进豆体，莓果调爆发。","r":"浅～浅中焙 · Agtron 80–68，一爆后发展 60–90 秒"},{"n":"Wolisho 地方种","f":"豆粒大、body 厚，黑糖与熟果甜","p":"日晒。这个株型糖分累积高、果肉厚，正是日晒批次甜度的来源；水洗会浪费它的厚度。","r":"浅中焙 · Agtron 76–66"},{"n":"Kurume 地方种","f":"花香密度最高，柑橘与茉莉","p":"水洗。小粒圆豆，水洗后花香与酸质的分离度最好，是西达摩水洗精品批次的核心。","r":"极浅～浅焙 · Agtron 84–74"},{"n":"74158 选育系","f":"甜感稳定、产量可靠，红糖与柑橘","p":"水洗、日晒皆可，一致性好，是合作社大批量出货的主力。","r":"浅～浅中焙 · Agtron 80–70"}],"tags":["蓝莓","柑橘","黑糖","可可","坚果甜"],"cup":"比耶加更圆润的一支。柑橘酸退到中景，前面站着黑莓和黑糖，收尾带可可与烤坚果。日晒批次常出现浓郁的蓝莓果酱感。","process":[{"n":"日晒","lvl":"标志","why":"西达摩的日晒是行业标杆：非洲晾床上薄层翻动 12–18 天，果胶糖分完整渗入豆体，莓果调爆发。"},{"n":"水洗","lvl":"推荐","why":"想要干净的柑橘与花香骨架时选水洗，酸质结构比日晒清晰得多。"}],"roast":{"n":"浅 – 浅中焙","range":"Agtron 80 – 68｜一爆后发展 60–90 秒","why":"稍多一点发展能把黑糖和可可拉出来，同时莓果香还没被烤掉——西达摩比耶加更经得起烘。"},"radar":{"acid":4,"body":3,"sweet":5,"aroma":4,"clean":4}},{"id":"guji","cn":"古吉","en":"Guji","zone":"奥罗米亚·古吉 Shakiso / Hambela","country":"埃塞俄比亚","iso":"ETH","flag":"🇪🇹","group":"africa","lon":38.91,"lat":5.76,"alt":"1800 – 2350 m","harvest":"11 月 – 次年 2 月","climate":{"rain":"1500 – 2000 mm","temp":"14 – 23 ℃","soil":"深层红壤，森林腐殖层厚","text":"过去被并入西达摩统称，2010 年后才独立成名。海拔更高、原始森林覆盖更完整，果实成熟期长，糖分累积到极限——这是古吉日晒常被形容为「果汁」的原因。"},"varieties":[{"n":"原生种群 Heirloom","f":"荔枝、白桃、玫瑰、糖浆质地","p":"日晒。古吉海拔高、成熟慢，糖分累积到极限，慢速阴干配合精细翻动能把热带水果调推满。","r":"极浅～浅焙 · Agtron 88–76，一爆结束即下豆"},{"n":"「花魁」日晒批次","f":"草莓、蓝莓、菠萝、发酵酒香，甜到黏口","p":"日晒——它本身就是一支日晒批次的名字，做成水洗就不叫花魁了。","r":"极浅～浅焙 · Agtron 88–78，一爆结束立刻下豆；温度多给 5 ℃ 就会把果酱感烤成焦糖","note":"严格说不是品种。2016 年埃塞 TOH 日晒组冠军（古吉 Hambela 的 Buku Abel 庄园）被中国进口商命名为「花魁」，此后成为逐年更新的批次品牌（花魁 1.0／2.0…），产区也从 Hambela 扩到整个古吉。豆种始终是当地原生种群。"},{"n":"74110 / 74112","f":"结构稳定的柑橘酸，干净度高","p":"水洗。古吉的水洗批次常被低估，花香比耶加更外放一些。","r":"浅焙 · Agtron 82–74"},{"n":"Wush Wush（少量）","f":"极端花香、荔枝与百香果","p":"水洗保香、厌氧增层次。产量极小，多为微批次。","r":"极浅焙 · Agtron 88–80","note":"原产埃塞西南 Kaffa 的地方种，近年因在哥伦比亚的表现而走红，古吉只有零星种植。"}],"tags":["荔枝","白桃","百香果","玫瑰","糖浆感"],"cup":"一口下去像咬开熟透的白桃。荔枝与玫瑰在鼻腔炸开，酸不锐利而是被浓稠糖浆裹住，余韵长得离谱。精品日晒古吉是近年杯测赛的常客。","process":[{"n":"日晒","lvl":"标志","why":"古吉的看家本领。慢速阴干配合精细翻动，把热带水果调推到极致，糖浆质地由此而来。"},{"n":"厌氧发酵","lvl":"实验向","why":"密闭罐控温发酵 48–96 h，会叠加酒渍、肉桂、朗姆的层次，但风险高，做坏就是醋味。"}],"roast":{"n":"极浅 – 浅焙","range":"Agtron 88 – 76｜一爆结束即下豆","why":"果酸与花香是全部卖点，多烘 20 秒就开始糊化。用低温长回温、拉长脱水段来避免夹生。"},"radar":{"acid":4,"body":3,"sweet":5,"aroma":5,"clean":4}},{"id":"harrar","cn":"哈拉尔","en":"Harrar","zone":"东部高地 Harari / East Hararghe","country":"埃塞俄比亚","iso":"ETH","flag":"🇪🇹","group":"africa","lon":42.12,"lat":9.31,"alt":"1400 – 2000 m","harvest":"10 月 – 次年 2 月","climate":{"rain":"600 – 900 mm","temp":"18 – 28 ℃","soil":"石灰质砂壤，土层薄、偏碱","text":"全埃塞最干、最热的产区，几乎没有遮荫树，全靠旱作。水资源匮乏反而锁死了处理方式：这里从数百年前就只做日晒。干旱胁迫下的果实小而皱，风味极度浓缩、野性十足。"},"varieties":[{"n":"哈拉尔长果种 Longberry","f":"蓝莓干、红酒、肉桂，干香浓烈","p":"日晒，且只能日晒。当地缺水，整颗带果在庭院石板或屋顶晒 3–4 周，深度发酵正是那股酒香与莓果干的来源。","r":"中浅～中焙 · Agtron 65–55，一爆后发展 90–120 秒","note":"低酸厚体的豆做浅焙反而显得空而尖，哈拉尔是少数「不该烘太浅」的埃塞豆。"},{"n":"哈拉尔短果种 Shortberry","f":"更厚实的黑巧与香料，酸更低","p":"日晒。豆粒小、密度高，晒场上更耐翻动，风味比长果种更沉。","r":"中焙 · Agtron 60–52"}],"tags":["蓝莓","黑巧克力","酒渍","肉桂","野性"],"cup":"埃塞的另一极。干香是浓烈的蓝莓干与红酒，入口厚重、带明显发酵感和香料尾巴，酸度低而醇厚度高——传统摩卡壶与土耳其咖啡的原型味道。","process":[{"n":"日晒","lvl":"唯一传统","why":"缺水决定的必然选择。整颗带果在庭院石板或屋顶上晒 3–4 周，深度发酵带来标志性的酒香与莓果干。"}],"roast":{"n":"中浅 – 中焙","range":"Agtron 65 – 55｜一爆后发展 90–120 秒","why":"哈拉尔本就低酸厚体，浅焙反而显得空且尖。往中焙走能把黑巧与香料的重量完整释放。"},"radar":{"acid":2,"body":5,"sweet":4,"aroma":4,"clean":2}},{"id":"nyeri","cn":"涅里","en":"Nyeri","zone":"中部省·肯尼亚山西南麓","country":"肯尼亚","iso":"KEN","flag":"🇰🇪","group":"africa","lon":36.95,"lat":-0.42,"alt":"1700 – 2000 m","harvest":"主产季 10 – 12 月｜副产季 6 – 8 月","climate":{"rain":"1000 – 1500 mm（双雨季）","temp":"12 – 26 ℃","soil":"深红色火山土，磷含量异常高","text":"肯尼亚山融雪补给、赤道横穿、一年两季雨——涅里的红土富含磷与铁，被普遍认为是肯尼亚咖啡那股「黑加仑番茄酸」的地质来源。昼夜温差常达 14 ℃ 以上。"},"varieties":[{"n":"SL28","f":"黑加仑、番茄、葡萄柚，糖浆般的质地","p":"肯尼亚式双重发酵水洗：发酵—水下浸泡—再发酵—再浸泡，共约 72 小时。这套流程是那股锐利澄澈酸质的直接成因，全球罕有复制成功的。","r":"浅中焙 · Agtron 72–62，一爆后发展 75–100 秒","note":"1935 年斯科特实验室从坦桑尼亚 French Mission 选育，抗旱、低产、深根系——肯尼亚风味的定义者。烘太浅会把酸推成刺口的青涩，这支豆需要一点发展来唤出糖浆感。"},{"n":"SL34","f":"body 更厚、酸稍柔，李子与红酒","p":"同样走双重发酵水洗。它比 SL28 更耐高降雨，常与 SL28 混采混处理。","r":"浅中～中焙 · Agtron 70–60"},{"n":"Ruiru 11","f":"风味偏平，柑橘与坚果","p":"水洗。1985 年为抗咖啡浆果病与叶锈发布的矮株高产种，处理上没有特殊要求。","r":"中焙 · Agtron 64–56。风味层次有限，往中焙走靠焦糖化补足甜感"},{"n":"Batian","f":"干净度好，接近 SL 系的酸质","p":"水洗。2010 年发布的新一代抗病种，兼顾了抗性与杯测表现，正在逐步替换 Ruiru 11。","r":"浅中焙 · Agtron 72–62"}],"tags":["黑加仑","番茄","葡萄柚","乌梅","糖浆体"],"cup":"世界上酸质最有攻击性的咖啡之一。黑加仑与番茄的酸像一记直拳，随后糖浆般的质地把它托住，尾韵是乌梅和红酒。冷了之后更甜、更立体。","process":[{"n":"双重发酵水洗","lvl":"标志","why":"肯尼亚式 72 小时工艺：发酵—水下浸泡—再发酵—再浸泡。这套流程是那股锐利澄澈酸质的直接成因，全球罕有复制成功的。"}],"roast":{"n":"浅中焙","range":"Agtron 72 – 62｜一爆后发展 75–100 秒","why":"太浅会把酸推成刺口的青涩，稍多发展能唤出糖浆感与黑醋栗的甜。这是少数「不该烘太浅」的高酸豆。"},"radar":{"acid":5,"body":4,"sweet":4,"aroma":4,"clean":5}},{"id":"kirinyaga","cn":"基里尼亚加","en":"Kirinyaga","zone":"中部省·肯尼亚山南麓","country":"肯尼亚","iso":"KEN","flag":"🇰🇪","group":"africa","lon":37.28,"lat":-0.5,"alt":"1500 – 1900 m","harvest":"主产季 10 – 12 月｜副产季 6 – 8 月","climate":{"rain":"1200 – 1600 mm（双雨季）","temp":"14 – 26 ℃","soil":"火山红壤，排水优良","text":"与涅里共享肯尼亚山水系，但小农合作社（当地叫 Factory，水洗处理厂）密度更高——Kii、Karimikui、Kianderi 这些名字其实都是处理厂而非村庄。批次管理极细，同一产区不同 Factory 的杯味差异明显。"},"varieties":[{"n":"SL28","f":"黑莓、树莓、青柠，红酒单宁感","p":"Factory（水洗处理厂）级别的双重发酵水洗，分批发酵、密度分级、河水浸泡，把果酸层次拆得极清楚。","r":"浅～浅中焙 · Agtron 76–66，一爆后发展 60–90 秒"},{"n":"SL34","f":"甜感与厚度，熟李子","p":"水洗为主。与 SL28 混合是基里尼亚加各 Factory 的常态配置。","r":"浅中焙 · Agtron 72–62"},{"n":"Batian","f":"干净明亮，柑橘与黑醋栗","p":"水洗。抗病性好，近年新种植区的主力。","r":"浅中焙 · Agtron 74–64"},{"n":"SL28 日晒微批次","f":"草莓、蜜饯、酒渍樱桃","p":"日晒。近年的实验批次，甜感翻倍，但牺牲了肯尼亚经典的澄澈度——喜不喜欢因人而异。","r":"浅焙 · Agtron 80–70"}],"tags":["黑莓","树莓","青柠","红酒","果汁感"],"cup":"比涅里更「果汁」的肯尼亚。黑莓与树莓的甜酸交织，青柠划出明亮的边界，中段有红酒的单宁感，收尾干净利落。","process":[{"n":"双重发酵水洗","lvl":"标志","why":"Factory 级别的精细控制：分批发酵、密度分级、河水浸泡，把果酸的层次拆得极清楚。"},{"n":"日晒（少量）","lvl":"少见","why":"近年出现的实验批次，会带出草莓与蜜饯，但牺牲了肯尼亚经典的澄澈度。"}],"roast":{"n":"浅 – 浅中焙","range":"Agtron 76 – 66｜一爆后发展 60–90 秒","why":"果汁感来自恰到好处的发展。烘过头，红酒调会变成木质味；烘不足，青柠就成了生青。"},"radar":{"acid":5,"body":3,"sweet":4,"aroma":4,"clean":5}},{"id":"rwanda-huye","cn":"胡耶 / 南部省","en":"Huye","zone":"南部省 Huye – Nyamasheke","country":"卢旺达","iso":"RWA","flag":"🇷🇼","group":"africa","lon":29.74,"lat":-2.6,"alt":"1700 – 2000 m","harvest":"3 月 – 7 月","climate":{"rain":"1200 – 1600 mm","temp":"15 – 25 ℃","soil":"风化火山岩与花岗岩壤，矿物质丰富","text":"「千丘之国」的地形让每一片坡地都自成微气候。赤道高原气候温和无极端，果实成熟均匀。挑战在于「马铃薯瑕疵」（PTD）——一种由细菌引起的生土豆味，需要靠人工挑豆和严格的湿处理控制。"},"varieties":[{"n":"Red Bourbon","f":"红苹果、橘子、焦糖，口感丝滑","p":"水洗。中央水洗站集中处理、浮选去瑕疵 + 控温发酵，既让波旁的甜感透明化，也是压制「马铃薯瑕疵」（PTD）风险的关键。","r":"浅中焙 · Agtron 75–65，一爆后发展 70–90 秒","note":"波旁的焦糖甜要一点发展才出得来，但花香又怕火——中浅是这支豆最稳的平衡点。"},{"n":"BM139","f":"甜感更集中，太妃糖与柑橘","p":"水洗。布隆迪 Mirwa 选育的波旁系，抗性与产量优于原始红波旁。","r":"浅中焙 · Agtron 74–64"},{"n":"Jackson","f":"花香突出，酸质细致","p":"水洗保香；蜜处理能补上它偏瘦的 body。","r":"浅焙 · Agtron 78–68"},{"n":"红波旁蜜处理批次","f":"更黏稠的甜、熟樱桃与红糖","p":"蜜处理。保留部分果胶晾晒，body 明显加厚，是卢旺达近年增长最快的精品做法。","r":"浅中焙 · Agtron 72–62。糖分高，升温要稳，避免焦糖化过头发苦"}],"tags":["红苹果","橘子","焦糖","茉莉","丝滑"],"cup":"温柔而精致。红苹果与橘子的甜酸，焦糖的中段，花香贯穿始终，口感丝滑不刺激。是把「优雅」这个词写进杯子里的那类咖啡。","process":[{"n":"水洗","lvl":"标志","why":"中央水洗站集中处理，浮选去瑕疵 + 控温发酵，是压制 PTD 风险的关键，也让波旁的甜感透明化。"},{"n":"蜜处理","lvl":"新兴","why":"保留部分果胶晾晒，甜度更黏稠、body 更厚，近年精品批次增长很快。"}],"roast":{"n":"浅中焙","range":"Agtron 75 – 65｜一爆后发展 70–90 秒","why":"波旁的焦糖甜需要一点发展才出得来，但花香又怕火。中浅是这支豆最稳的平衡点。"},"radar":{"acid":4,"body":3,"sweet":5,"aroma":4,"clean":4}},{"id":"burundi-kayanza","cn":"卡扬扎","en":"Kayanza","zone":"北部 Kayanza – Ngozi","country":"布隆迪","iso":"BDI","flag":"🇧🇮","group":"africa","lon":29.63,"lat":-2.92,"alt":"1700 – 2000 m","harvest":"3 月 – 7 月","climate":{"rain":"1300 – 1600 mm","temp":"15 – 24 ℃","soil":"火山与变质岩风化壤，微酸","text":"与卢旺达同处一片高原，气候几乎互为镜像。咖啡由数十万微型农户种植，每户往往不足一公顷，全靠 washing station（当地称 SOGESTAL）汇集。批次可追溯到「某座山某个星期」。"},"varieties":[{"n":"Red Bourbon","f":"黑加仑、柑橘、红糖，尾韵茉莉","p":"水洗，且是借鉴自肯尼亚的双重浸泡流程——布隆迪的干净度与酸质分离度就出自这里。","r":"浅中焙 · Agtron 76–66，一爆后发展 70–90 秒"},{"n":"Mibirizi","f":"花香细致，青苹果与蜂蜜","p":"水洗。源自刚果的波旁选育系，豆体偏小，发酵需要更严格的控温。","r":"浅焙 · Agtron 80–70"},{"n":"Jackson","f":"甜厚、柑橘明亮","p":"水洗为主，高海拔批次做日晒会带出草莓与热带果。","r":"浅中焙 · Agtron 76–64"}],"tags":["黑加仑","柑橘","红糖","茉莉","干净"],"cup":"介于卢旺达的柔和与肯尼亚的锐利之间。黑加仑的酸有骨架但不咄咄逼人，红糖甜垫底，尾韵飘着茉莉。性价比常年被低估。","process":[{"n":"水洗","lvl":"标志","why":"双重浸泡的水洗流程借鉴自肯尼亚，做出的干净度与酸质分离度是布隆迪的招牌。"},{"n":"日晒","lvl":"推荐","why":"高海拔慢晒批次会带出草莓与热带果，甜感明显加厚。"}],"roast":{"n":"浅中焙","range":"Agtron 76 – 66｜一爆后发展 70–90 秒","why":"和卢旺达同理，波旁需要一点点发展来释放红糖甜，同时守住花香。"},"radar":{"acid":4,"body":3,"sweet":4,"aroma":4,"clean":5}},{"id":"kilimanjaro","cn":"乞力马扎罗","en":"Kilimanjaro","zone":"莫希 Moshi – Arusha 山坡","country":"坦桑尼亚","iso":"TZA","flag":"🇹🇿","group":"africa","lon":37.34,"lat":-3.35,"alt":"1400 – 1900 m","harvest":"7 月 – 12 月","climate":{"rain":"1000 – 1600 mm","temp":"15 – 25 ℃","soil":"乞力马扎罗火山灰壤，深厚肥沃","text":"非洲最高峰南坡的火山土配上稳定的山地降雨，Chagga 人在这里维持了上百年的香蕉—咖啡间作系统：香蕉树提供遮荫与保湿，咖啡长在其下。这套农法本身就是坦桑风味清爽的一部分原因。"},"varieties":[{"n":"Bourbon","f":"黑醋栗、柑橘的经典酸甜","p":"水洗，配合 AA/AB 尺寸分级出货，稳定干净。","r":"中浅焙 · Agtron 70–60，一爆后发展 80–110 秒"},{"n":"Kent","f":"雪松、红酒感，body 圆润","p":"水洗。原是印度为抗叶锈选育的老种，1920 年代引入东非，至今仍在乞力马扎罗山坡的老园里。","r":"中浅～中焙 · Agtron 68–58"},{"n":"N39 / KP423","f":"甜厚度好，焦糖与坚果","p":"水洗。坦桑本地选育的抗病系，产量稳定，是商业批次主力。","r":"中焙 · Agtron 64–54。酸质本就温和，往中焙走能把雪松与焦糖做厚"},{"n":"Blue Mountain 系","f":"温和平衡，酸柔、甜净","p":"水洗。从牙买加引种，在坦桑长成了另一种温和风格。","r":"中浅焙 · Agtron 68–58"}],"tags":["黑醋栗","柑橘","雪松","红酒","圆润"],"cup":"像被调低了音量的肯尼亚。黑醋栗仍在，但更温和；中段有雪松与淡淡红酒感，尾韵干净带焦糖。AA 分级的大颗粒豆是市场主力。","process":[{"n":"水洗","lvl":"标志","why":"坦桑主流工艺，配合 AA/AB 尺寸分级，出品稳定、干净度高。"},{"n":"日晒","lvl":"少量","why":"多见于南部 Mbeya 一带，果香更甜厚，Kilimanjaro 本身少做。"}],"roast":{"n":"中浅焙","range":"Agtron 70 – 60｜一爆后发展 80–110 秒","why":"酸质本就温和，稍多的发展能把雪松和焦糖的层次做厚，也让它在意式配方里更好用。"},"radar":{"acid":4,"body":4,"sweet":4,"aroma":3,"clean":4}},{"id":"mtelgon","cn":"埃尔贡山 / 布吉苏","en":"Mt. Elgon (Bugisu)","zone":"东部 Bugisu – Sipi","country":"乌干达","iso":"UGA","flag":"🇺🇬","group":"africa","lon":34.35,"lat":1.15,"alt":"1500 – 2300 m","harvest":"10 月 – 次年 3 月","climate":{"rain":"1200 – 1800 mm","temp":"14 – 24 ℃","soil":"死火山灰壤，富钾、排水好","text":"埃尔贡是一座巨大的死火山，山坡云雾带常年湿润。乌干达整体以罗布斯塔产量闻名（是罗布斯塔的原生地之一），但埃尔贡山的高海拔带做的是货真价实的阿拉比卡，Sipi Falls 一带的批次品质稳定攀升。"},"varieties":[{"n":"SL14 / SL28","f":"柑橘酸与糖浆感","p":"水洗。埃尔贡高海拔带的水洗批次能把柑橘酸彻底解放出来，干净度提升明显。","r":"浅中～中焙 · Agtron 70–58"},{"n":"Nyasaland","f":"厚实 body、黑巧尾韵","p":"水洗或日晒都行。这支老种的价值在重量感，日晒会让葡萄干味更重。","r":"中焙 · Agtron 62–52，一爆后发展 100–130 秒","note":"埃尔贡豆的资本是厚度与巧克力感，浅焙只剩下单薄的酸——这是少数值得往中焙推的非洲豆。"},{"n":"本地 Elgon 老种","f":"葡萄干与坚果的沉稳甜","p":"日晒是小农自家的传统做法，甜厚、果干味重，但一致性不如水洗。","r":"中焙 · Agtron 60–52"}],"tags":["黑巧克力","葡萄干","柑橘","坚果","厚实"],"cup":"厚而稳。黑巧与葡萄干打底，柑橘酸在中段冒头，坚果甜收尾。醇厚度是它最大的资本，做浓缩基底非常出彩。","process":[{"n":"水洗","lvl":"推荐","why":"高海拔批次做水洗能把柑橘酸解放出来，干净度显著提升。"},{"n":"日晒","lvl":"传统","why":"小农自家晾晒的传统做法，甜厚、果干味重，但一致性不如水洗。"}],"roast":{"n":"中焙","range":"Agtron 62 – 52｜一爆后发展 100–130 秒","why":"这支豆的价值在厚度与巧克力感，中焙把它们完整推出来；浅焙反而只剩下单薄的酸。"},"radar":{"acid":3,"body":5,"sweet":4,"aroma":3,"clean":3}},{"id":"kivu","cn":"基伍","en":"Kivu","zone":"南北基伍省·基伍湖沿岸","country":"刚果（金）","iso":"COD","flag":"🇨🇩","group":"africa","lon":28.95,"lat":-2.2,"alt":"1400 – 2000 m","harvest":"3 月 – 8 月","climate":{"rain":"1200 – 1600 mm","temp":"16 – 25 ℃","soil":"维龙加火山灰壤，深厚肥沃","text":"基伍湖调节温度、维龙加火山群供给养分，自然条件与卢旺达、布隆迪完全同级。真正的限制从来不是风土而是基础设施与局势——近年由合作社推动的湖心岛（Idjwi）批次，正在把这片被低估的产区重新推上国际杯测桌。"},"varieties":[{"n":"Bourbon（Jackson / Mibirizi）","f":"柑橘、红糖、花香，body 清爽","p":"水洗。合作社中央水洗站的标准流程，是这片区域品质一致性的关键。","r":"浅中焙 · Agtron 76–66，一爆后发展 70–90 秒"},{"n":"Rumangabo","f":"甜感清亮，青苹果与蜂蜜","p":"水洗。本地波旁选育，适应基伍湖畔的高湿环境。","r":"浅中焙 · Agtron 76–66"},{"n":"波旁蜜处理批次","f":"更厚的甜与熟果","p":"蜜处理。少量精品批次的尝试，甜度与 body 提升明显。","r":"浅中焙 · Agtron 72–62"}],"tags":["柑橘","红糖","花香","青苹果","清爽"],"cup":"明亮而轻盈。柑橘与青苹果的酸，红糖的甜，body 不重但很干净，收尾有淡淡花香。喝起来像卢旺达的兄弟，只是更少被人认识。","process":[{"n":"水洗","lvl":"标志","why":"合作社中央水洗站的标准流程，是保证这片区域品质一致性的关键环节。"},{"n":"蜜处理","lvl":"新兴","why":"少量精品批次尝试，甜度与 body 明显提升。"}],"roast":{"n":"浅中焙","range":"Agtron 76 – 66｜一爆后发展 70–90 秒","why":"波旁的通用解：留住花香与柑橘，同时让红糖甜出来。"},"radar":{"acid":4,"body":3,"sweet":4,"aroma":4,"clean":4}},{"id":"yemen-bani","cn":"巴尼马塔尔 / 哈拉兹","en":"Bani Matar & Haraz","zone":"萨那西部山区","country":"也门","iso":"YEM","flag":"🇾🇪","group":"africa","lon":43.75,"lat":15.35,"alt":"1500 – 2400 m","harvest":"10 月 – 次年 2 月","climate":{"rain":"400 – 600 mm","temp":"10 – 30 ℃（日夜温差极大）","soil":"石灰质砂壤，土层极薄","text":"世界上最艰难的咖啡产地。年降雨不足他处一半，农人在陡峭山脊上垒出千年梯田，靠季节性洪水与井水灌溉。极端干旱胁迫让果实小、皱、密度极高——也门豆外形丑陋，却是咖啡商业化的起点（Mocha 港即由此得名）。"},"varieties":[{"n":"Udaini","f":"香料、雪松、干净的果干甜","p":"日晒，且只能日晒——年降雨不足他处一半，缺水决定了一切。整颗果在民居屋顶或梯田石台上摊晒数周。","r":"中浅～中焙 · Agtron 68–55，一爆后发展 90–120 秒","note":"也门豆密度不均、含水率偏低，需要更温和的火力与更长的发展段来避免外焦内生。"},{"n":"Tuffahi（苹果种）","f":"苹果、蜜饯，酸质在也门豆里算清亮","p":"日晒。这支相对干净，是想入门也门风味时较友好的选择。","r":"中浅焙 · Agtron 70–60"},{"n":"Dawairi / Jaadi","f":"厚重、发酵酒感、可可与丁香","p":"日晒。发酵程度最深的一类，野性也最强。","r":"中焙 · Agtron 62–52"},{"n":"Yemenia 种群","f":"复杂的香料与果干，层次感突出","p":"日晒。2021 年公布的遗传分类，指也门独有、既非 Typica 也非 Bourbon 的一支古老种群。","r":"中浅焙 · Agtron 68–58","note":"由 Qima Coffee 与遗传学家 Christophe Montagnon 的研究提出，是阿拉比卡已知的第三大种群，为也门豆的高溢价提供了科学依据。"}],"tags":["蓝莓干","香料","雪松","可可","发酵酒感"],"cup":"野性、复杂、不驯服。干香是香料与旧木箱，入口是浓缩的蓝莓干与葡萄干，中段浮出可可与丁香，尾韵带明显发酵酒感。它的魅力恰恰在于「不干净」。","process":[{"n":"日晒","lvl":"唯一传统","why":"缺水使然。整颗咖啡果在民居屋顶或梯田石台上摊晒数周，果皮干缩成硬壳，深度发酵造就了那股无法复制的香料酒感。"}],"roast":{"n":"中浅 – 中焙","range":"Agtron 68 – 55｜一爆后发展 90–120 秒","why":"这支豆密度不均、含水率偏低，需要更温和的火力与更长的发展来避免外焦内生，同时把香料与可可的重量托起来。"},"radar":{"acid":3,"body":5,"sweet":4,"aroma":5,"clean":2}},{"id":"huila","cn":"惠兰","en":"Huila","zone":"安第斯中央与东部山脉之间","country":"哥伦比亚","iso":"COL","flag":"🇨🇴","group":"samerica","lon":-75.85,"lat":1.95,"alt":"1500 – 2000 m","harvest":"主产季 9 – 12 月｜副产季 4 – 6 月","climate":{"rain":"1300 – 1800 mm","temp":"17 – 23 ℃","soil":"火山灰与冲积混合壤，深厚、微酸","text":"马格达莱纳河谷被两道安第斯山脉夹住，形成稳定的山谷微气候。赤道附近的双雨季让哥伦比亚一年能收两次，惠兰又因地形复杂，几乎每条支谷的杯味都不一样。它是哥伦比亚精品咖啡产量与得奖数的双料冠军。"},"varieties":[{"n":"Caturra","f":"红苹果、焦糖，中等酸度的经典哥伦比亚","p":"水洗。小农各家自备去皮机与发酵槽，12–18 小时发酵后清洗晾晒，那股「透明甜感」就出自这套精细的传统工艺。","r":"浅中～中焙 · Agtron 72–58，一爆后发展 80–110 秒","note":"波旁的自然矮化变种，1915 年发现于巴西，是中南美精品的主力老种。"},{"n":"Castillo","f":"甜感厚、酸柔，可可与坚果","p":"水洗最稳。2005 年发布的抗叶锈主力种，产量高、抗性强，但风味上限不如 Caturra——精品批次靠精细发酵来补。","r":"中焙 · Agtron 66–56。酸不突出，往中焙走把可可与坚果做厚更讨喜"},{"n":"Pink Bourbon","f":"热带花香、佛手柑与柑橘，甜度极高","p":"水洗保香，厌氧能叠出更浓的荔枝与朗姆感。这是惠兰近年溢价最高的一支。","r":"极浅～浅焙 · Agtron 86–74，一爆结束即下豆","note":"名字叫波旁，基因却对不上：近年研究显示它更接近埃塞原生种群，与波旁并无直接亲缘。名称是历史误会，风味是真的。"},{"n":"Typica / Colombia","f":"平衡、坚果与可可","p":"水洗。老园里的存量品种，产量低但甜感温润。","r":"中焙 · Agtron 66–56"}],"tags":["红苹果","焦糖","柑橘","太妃糖","平衡"],"cup":"教科书级的平衡。红苹果与柑橘的中等酸度，焦糖与太妃糖的甜厚中段，收尾干净带一点可可。没有攻击性，几乎不会踩雷。","process":[{"n":"水洗","lvl":"标志","why":"哥伦比亚小农各家自备去皮机与发酵槽，水洗做到极致精细，是那股「透明甜感」的来源。"},{"n":"厌氧 / 蜜处理","lvl":"新兴","why":"近五年惠兰是实验处理法的重镇，密闭发酵能叠出荔枝、朗姆、肉桂等浓烈层次，溢价高。"}],"roast":{"n":"浅中 – 中焙","range":"Agtron 72 – 58｜一爆后发展 80–110 秒","why":"甜感与平衡是核心资产。浅焙保酸、中焙出焦糖，两端都成立，这也是惠兰被单品与配方通吃的原因。"},"radar":{"acid":4,"body":4,"sweet":5,"aroma":4,"clean":5}},{"id":"narino","cn":"娜玲珑","en":"Nariño","zone":"哥伦比亚西南·近厄瓜多尔边境","country":"哥伦比亚","iso":"COL","flag":"🇨🇴","group":"samerica","lon":-77.28,"lat":1.36,"alt":"1800 – 2300 m","harvest":"4 月 – 8 月","climate":{"rain":"1000 – 1500 mm","temp":"13 – 21 ℃","soil":"加莱拉斯火山灰壤，矿物丰富","text":"哥伦比亚海拔最高的产区之一。特殊之处在于山谷的暖气流会在夜间上升，抵消了高海拔本该带来的冻害——于是咖啡能种到 2300 m 而不受伤，果实成熟极慢，酸质与甜度累积到哥伦比亚的天花板。"},"varieties":[{"n":"Caturra","f":"明亮柑橘、青柠与焦糖","p":"水洗。娜玲珑海拔高、夜温低，发酵变慢因而极可控，做出的酸质分离度是全哥伦比亚最好的之一。","r":"浅～浅中焙 · Agtron 78–66，一爆后发展 60–90 秒","note":"高密度豆需要充足的脱水段避免夹生，但发展要克制——它的价值在明亮，不在厚重。"},{"n":"Typica","f":"细致花香与柔和酸，蜂蜜甜","p":"水洗保香；蜜处理能补上高海拔豆偏瘦的 body。","r":"浅焙 · Agtron 80–70"},{"n":"Castillo","f":"甜厚稳定，红糖与可可","p":"水洗。抗病主力，是合作社出货的基本盘。","r":"浅中～中焙 · Agtron 72–60"}],"tags":["柑橘","青柠","焦糖","茉莉","明亮"],"cup":"哥伦比亚里酸质最亮的一支。青柠与柑橘干净利落，甜度依然扎实，尾韵带茉莉与红糖。喝惯了惠兰再喝娜玲珑，会明显感到海拔的差别。","process":[{"n":"水洗","lvl":"标志","why":"高海拔低温让发酵变慢，可控性极佳，做出的酸质分离度是娜玲珑的招牌。"},{"n":"蜜处理","lvl":"推荐","why":"保留果胶能补上高海拔豆偏瘦的 body，甜感更黏。"}],"roast":{"n":"浅 – 浅中焙","range":"Agtron 78 – 66｜一爆后发展 60–90 秒","why":"高密度豆需要充足的脱水段避免夹生，但发展要克制——它的价值在明亮，不在厚重。"},"radar":{"acid":5,"body":3,"sweet":4,"aroma":4,"clean":5}},{"id":"antioquia","cn":"安蒂奥基亚","en":"Antioquia","zone":"哥伦比亚咖啡文化景观核心带","country":"哥伦比亚","iso":"COL","flag":"🇨🇴","group":"samerica","lon":-75.75,"lat":5.9,"alt":"1400 – 1900 m","harvest":"主产季 9 – 12 月｜副产季 4 – 6 月","climate":{"rain":"1800 – 2200 mm","temp":"18 – 24 ℃","soil":"火山灰壤，有机质厚","text":"这里是「哥伦比亚咖啡文化景观」世界遗产的核心，也是国民形象 Juan Valdez 的故乡。降雨比惠兰更充沛、温度更暖，果实成熟略快，风味走的是圆润讨喜的路线而非极致酸质。"},"varieties":[{"n":"Caturra","f":"太妃糖、红苹果，酸度温和","p":"水洗（当地叫 fermentado y lavado），把甜感做得圆而不腻。","r":"中焙 · Agtron 65–55，一爆后发展 100–130 秒","note":"这支豆的坚果可可需要发展才出得来，中焙也让它在拿铁里能穿透奶味而不发苦。"},{"n":"Castillo","f":"可可、坚果，甜感稳定","p":"水洗。产量主力，一致性好。","r":"中焙 · Agtron 64–54"},{"n":"Typica 老树","f":"温润花香与蜂蜜","p":"水洗保香。老园存量不多，多做微批次。","r":"浅中焙 · Agtron 72–62"}],"tags":["太妃糖","榛果","可可","红苹果","圆润"],"cup":"最「好入口」的哥伦比亚。榛果与可可打底，太妃糖的甜厚中段，酸度温和不抢戏。牛奶饮品的黄金基底。","process":[{"n":"水洗","lvl":"标志","why":"传统 fermentado y lavado 工艺，把甜感做得圆而不腻。"},{"n":"日晒","lvl":"少量","why":"少数庄园的实验批次，会带出明显的莓果与酒感。"}],"roast":{"n":"中焙","range":"Agtron 65 – 55｜一爆后发展 100–130 秒","why":"坚果与可可需要发展来释放，中焙也让它在拿铁里穿透奶味而不发苦。"},"radar":{"acid":3,"body":4,"sweet":5,"aroma":3,"clean":4}},{"id":"cerrado","cn":"喜拉多","en":"Cerrado Mineiro","zone":"米纳斯吉拉斯州西部高原","country":"巴西","iso":"BRA","flag":"🇧🇷","group":"samerica","lon":-46.99,"lat":-18.94,"alt":"800 – 1300 m","harvest":"5 月 – 9 月","climate":{"rain":"1400 – 1700 mm（雨旱季分明）","temp":"18 – 28 ℃","soil":"深厚酸性红壤（Latossolo），需大量改良","text":"巴西第一个获得原产地保护（D.O.）的咖啡产区。地势平坦、雨旱季界限极其分明——采收期正好落在完全干燥的冬季，这让全面机械化采收和大规模日晒成为可能。喜拉多是「工业级稳定」这四个字的产地注脚。"},"varieties":[{"n":"Mundo Novo","f":"厚实 body、坚果与可可，酸度极低","p":"日晒 Natural。干燥的冬季采收期让整颗晾晒变得低风险，糖分完整保留——巴西的坚果巧克力调就是这么来的。","r":"中～中深焙 · Agtron 55–45，一爆后发展 120–160 秒","note":"Bourbon × Typica 的自然杂交，1940 年代发现于圣保罗州，是巴西产量的骨干。低酸厚体天生适合深走。"},{"n":"Catuaí（红／黄）","f":"焦糖甜与柔和酸，body 中等","p":"半日晒 Pulped Natural（去皮留果胶再晒，巴西独创）能提升干净度、让甜感更集中，是精品批次的主流选择。","r":"中焙 · Agtron 58–48"},{"n":"Icatu / Obatã","f":"风味平稳，可可与谷物甜","p":"日晒。抗病高产的现代选育种，机械采收友好，风味上限一般但极稳定。","r":"中深焙 · Agtron 52–44。层次有限，靠焦糖化补足厚度，是意式配方的基底常客"}],"tags":["榛果","牛奶巧克力","焦糖","花生","低酸"],"cup":"浓缩咖啡的世界基准。榛果与牛奶巧克力从头贯穿到尾，酸度低到几乎不存在，body 厚实、油脂丰沛，甜是那种烤过的坚果甜。","process":[{"n":"日晒 Natural","lvl":"标志","why":"干燥的冬季采收期让整颗晾晒变得低风险，糖分完整保留，是巴西坚果巧克力调的根本来源。"},{"n":"半日晒 Pulped Natural","lvl":"推荐","why":"去皮留果胶再晒（巴西独创），干净度提升、甜感更集中，精品批次的主流选择。"}],"roast":{"n":"中 – 中深焙","range":"Agtron 55 – 45｜一爆后发展 120–160 秒","why":"低酸厚体的豆天生适合深走。中深焙把巧克力与焦糖推满，是意式配方里当基底的经典角色。"},"radar":{"acid":1,"body":5,"sweet":5,"aroma":3,"clean":4}},{"id":"mogiana","cn":"摩吉安纳","en":"Mogiana","zone":"圣保罗州东北 – 米纳斯交界","country":"巴西","iso":"BRA","flag":"🇧🇷","group":"samerica","lon":-47.4,"lat":-20.54,"alt":"900 – 1200 m","harvest":"5 月 – 9 月","climate":{"rain":"1400 – 1600 mm","temp":"17 – 27 ℃","soil":"terra roxa 紫红土（玄武岩风化），肥力极高","text":"巴西咖啡的老牌贵族产区，19 世纪铁路时代就是出口重镇。玄武岩风化的紫红土是它的秘密武器——比喜拉多的酸性红壤肥沃得多，加上丘陵地形带来的排水优势，风味比平原产区更有层次。"},"varieties":[{"n":"Yellow Bourbon","f":"蜂蜜、柑橘、明亮甜感——摩吉安纳的招牌","p":"半日晒 Pulped Natural。保留果胶晾晒把蜂蜜甜锁住，同时避开全日晒容易带来的粗糙发酵味。","r":"中浅～中焙 · Agtron 65–52，一爆后发展 100–140 秒","note":"这是巴西里少见的「有酸」品种，值得比喜拉多烘浅一点，把蜂蜜与柑橘留住；但太浅会浪费它的厚度。"},{"n":"Mundo Novo","f":"厚实与可可，杏仁尾韵","p":"日晒。紫红土（terra roxa）的肥力让这支豆在摩吉安纳比别处更有层次。","r":"中焙 · Agtron 58–48"},{"n":"Catuaí","f":"焦糖与均衡","p":"半日晒或日晒皆可。","r":"中焙 · Agtron 58–48"}],"tags":["蜂蜜","杏仁","柑橘","焦糖","丝滑"],"cup":"巴西里少见的「有酸」。黄波旁带来蜂蜜与柑橘的亮度，杏仁与焦糖构成扎实中段，口感丝滑。是巴西单品里最不像巴西的那一支。","process":[{"n":"半日晒 Pulped Natural","lvl":"标志","why":"保留果胶晾晒，把黄波旁的蜂蜜甜锁住，同时避免全日晒容易带来的粗糙发酵味。"},{"n":"日晒","lvl":"推荐","why":"传统做法，甜度更浓，果干味明显。"}],"roast":{"n":"中浅 – 中焙","range":"Agtron 65 – 52｜一爆后发展 100–140 秒","why":"比喜拉多值得烘浅一点，好把黄波旁的蜂蜜与柑橘留住；但太浅会浪费它的厚度。"},"radar":{"acid":3,"body":4,"sweet":5,"aroma":3,"clean":4}},{"id":"sul-de-minas","cn":"南米纳斯","en":"Sul de Minas","zone":"米纳斯吉拉斯州南部丘陵","country":"巴西","iso":"BRA","flag":"🇧🇷","group":"samerica","lon":-45.44,"lat":-21.55,"alt":"700 – 1200 m","harvest":"5 月 – 9 月","climate":{"rain":"1500 – 1800 mm","temp":"16 – 26 ℃","soil":"红黄壤，丘陵坡地排水良好","text":"巴西产量最大的单一产区，全国近三分之一的咖啡出自这片丘陵。地形起伏使得高海拔小农与平原大庄园并存，品质跨度极大——从超市拼配豆到国际杯测冠军，都能在这里找到。"},"varieties":[{"n":"Catuaí（红／黄）","f":"焦糖、坚果，甜感稳定","p":"日晒 Natural。产量与干燥气候决定的主流工艺，成本低、甜感厚。","r":"中～中深焙 · Agtron 58–45，一爆后发展 120–160 秒"},{"n":"Mundo Novo","f":"body 与可可，牛奶巧克力","p":"日晒；精品批次用半日晒换取更高的干净度。","r":"中深焙 · Agtron 52–44。低酸高甜的经典基底豆，往深走能获得最饱满的油脂"},{"n":"Bourbon（高海拔批次）","f":"蜂蜜与柑橘，甜度突出","p":"半日晒。1200 m 以上的小农批次，是南米纳斯里能做出杯测分数的部分。","r":"中浅焙 · Agtron 64–54"}],"tags":["焦糖","杏仁", id":4,"body":4,"sweet":5,"aroma":4,"clean":5}},{"id":"boquete","cn":"波奎特","en":"Boquete","zone":"奇里基省·巴鲁火山东坡","country":"巴拿马","iso":"PAN","flag":"🇵🇦","group":"camerica","lon":-82.44,"lat":8.78,"alt":"1200 – 1900 m","harvest":"12 月 – 次年 3 月","climate":{"rain":"2500 – 3500 mm","temp":"13 – 24 ℃","soil":"巴鲁火山灰壤，富矿物质","text":"太平洋与加勒比海的气流在此交汇，形成当地人称 bajareque 的细雾雨——一种几乎不落地的悬浮水雾，长年笼罩坡地，配合火山土与云雾遮荫，让果实的成熟期被拉到极限。翡翠庄园的瑰夏在 2004 年 BOP 上一战成名，从此改写了精品咖啡的价格天花板。"},"varieties":[{"n":"Geisha / Gesha","f":"茉莉、佛手柑、白桃、百香果，长得不合理的茶感尾韵","p":"水洗。瑰夏的花香与茶感必须靠水洗才能完全透明地呈现，几乎所有 BOP 冠军批次都是水洗。日晒与厌氧能把热带水果与酒感叠得更浓、价格更高，但会遮住它最珍贵的清冷花香。","r":"极浅～浅焙 · Agtron 88–76，一爆结束即下豆","note":"1930 年代自埃塞 Gesha 村采集、经坦桑与哥斯达黎加辗转引入巴拿马，2004 年翡翠庄园（Hacienda La Esmeralda）在 BOP 上一战成名，从此改写精品咖啡的价格天花板。它的价值百分之百在香气——业界共识是宁可浅到略带青涩，也不能烘过。"},{"n":"Caturra / Catuai","f":"焦糖与柑橘的稳定基底","p":"水洗。波奎特的日常款，性价比远好于瑰夏。","r":"浅中～中焙 · Agtron 72–60"},{"n":"Typica 老树","f":"温润花香与蜂蜜","p":"水洗保香。","r":"浅中焙 · Agtron 74–62"}],"tags":["茉莉","佛手柑","白桃","百香果","茶感"],"cup":"瑰夏的标准答案。香气浓到像揭开一罐花茶，佛手柑与白桃在口中层层展开，酸质细腻不刺，尾韵是长得不合理的茉莉茶感。喝过一次就明白它为什么能卖到每磅上千美元。","process":[{"n":"水洗","lvl":"标志","why":"瑰夏的花香与茶感靠水洗才能完全透明地呈现，几乎所有 BOP 冠军批次都是水洗。"},{"n":"日晒 / 厌氧","lvl":"高端实验","why":"把热带水果与酒感叠到更浓，价格更高，但会遮住瑰夏最珍贵的清冷花香。"}],"roast":{"n":"极浅 – 浅焙","range":"Agtron 88 – 76｜一爆结束即下豆","why":"瑰夏的价值百分之百在香气。任何多余的发展都是对成本的浪费——业界共识是宁可浅到略带青涩，也不能烘过。"},"radar":{"acid":4,"body":2,"sweet":5,"aroma":5,"clean":5}},{"id":"santa-barbara","cn":"圣芭芭拉","en":"Santa Bárbara","zone":"西部 Santa Bárbara 山脉","country":"洪都拉斯","iso":"HND","flag":"🇭🇳","group":"camerica","lon":-88.24,"lat":14.92,"alt":"1400 – 1900 m","harvest":"12 月 – 次年 4 月","climate":{"rain":"1400 – 1800 mm","temp":"16 – 25 ℃","soil":"石灰岩与黏土混合壤","text":"洪都拉斯十年间从「拼配豆产地」翻身为 COE 常胜军，圣芭芭拉山是这场逆转的中心。山脉北坡的云雾带海拔集中在 1500 m 以上，微批次处理设施在近年密集投入，品质提升速度是中美洲最快的。"},"varieties":[{"n":"Bourbon / Pacas","f":"蜂蜜、柑橘，口感丝滑","p":"水洗把甜感与干净度稳定输出；日晒则是洪都拉斯近年 COE 得奖批次的杀手锏，热带水果与酒香表现力极强。","r":"浅中焙 · Agtron 74–62，一爆后发展 70–100 秒","note":"Pacas 是波旁在萨尔瓦多的自然矮化变种，1949 年由 Pacas 家族发现，后来传遍中美 "水洗","lvl":"标志","why":"高海拔低温发酵可控，水洗把 Typica 的花香做得极透明。"},{"n":"日晒 / 蜜处理","lvl":"精品向","why":"微批次实验，甜度与 body 明显加厚。"}],"roast":{"n":"浅 – 浅中焙","range":"Agtron 78 – 66｜一爆后发展 60–90 秒","why":"花香与细腻是全部价值所在，克制发展，避免焦糖味压过茉莉。"},"radar":{"acid":4,"body":3,"sweet":4,"aroma":5,"clean":5}},{"id":"loja","cn":"洛哈","en":"Loja","zone":"厄瓜多尔南部安第斯","country":"厄瓜多尔","iso":"ECU","flag":"🇪🇨","group":"samerica","lon":-79.2,"lat":-4.0,"alt":"1400 – 2100 m","harvest":"5 月 – 9 月","climate":{"rain":"1000 – 1600 mm","temp":"14 – 24 ℃","soil":"火山灰与山地壤混合","text":"厄瓜多尔是少数能在国境内同时种植咖啡与可可的国家，而洛哈是它的精品核心。赤道加高海拔的组合让昼夜温差极大，加上近年瑰夏与稀有品种的密集引种，这里成了南美最活跃的实验场之一。"},"varieties":[{"n":"Sidra","f":"苹果、蜂蜜、佛手柑，甜度极高","p":"水洗最能呈现它干净的花果层次；厄瓜多尔庄园在厌氧发酵上非常激进，能叠出朗姆、荔枝与肉桂。","r":"极浅～浅焙 · Agtron 86–74，一爆结束即下豆","note":"厄瓜多尔的明星种，一般认为源自 Bourbon 与 Typica 系的选育，稀有品种的香气就是溢价来源——与瑰夏同理，浅到底，别浪费。"},{"n":"Typica / Bourbon","f":"蜂蜜、坚果，柔和酸","p":"水洗。洛哈的日常基底。","r":"浅中焙 · Agtron 74–62"},{"n":"Geisha","f":"茉莉与热带水果","p":"水洗保香。","r":"极浅～浅焙 · Agtron 88–76"}],"tags":["苹果","茉莉","蜂蜜","佛手柑","高甜"],"cup":"Sidra 品种让洛哈近年声名鹊起：苹果与蜂蜜的高甜，佛手柑与茉莉的香气，酸质圆润不尖。是南美最接近埃塞风格的产区之一。","process":[{"n":"水洗","lvl":"标志","why":"呈现 Sidra 与瑰夏花香的最干净路径。"},{"n":"厌氧 / 日晒","lvl":"实验重镇","why":"厄瓜多尔庄园在发酵实验上非常激进，能叠出朗姆、荔枝、肉桂等强烈层次。"}],"roast":{"n":"极浅 – 浅焙","range":"Agtron 86 – 74｜一爆结束即下豆","why":"稀有品种的香气是溢价来源，与瑰夏同理——浅到底，别浪费。"},"radar":{"acid":4,"body":3,"sweet":5,"aroma":5,"clean":5}},{"id":"bluemountain","cn":"蓝山","en":"Blue Mountain","zone":"东部蓝山山脉（法定产区）","country":"牙买加","iso":"JAM","flag":"🇯🇲","group":"camerica","lon":-76.65,"lat":18.05,"alt":"900 – 1700 m（法定上限 1700 m）","harvest":"9 月 – 次年 3 月","climate":{"rain":"1900 – 2500 mm","temp":"15 – 24 ℃","soil":"火山与花岗岩风化壤，排水极好","text":"加勒比海的湿润气流在山脊上凝成常年不散的蓝色雾霭——山名与咖啡名都由此而来。云雾天然遮荫、成熟期被拉长到 9–10 个月（多数产区只要 6–7 个月）。牙买加以法律划定产区边界与海拔上限，并强制木桶包装出口，稀缺性被制度性地锁死。","note":"只有蓝山山脉法定边界内、海拔 910–1700 m 的咖啡才能叫 Jamaica Blue Mountain。"},"varieties":[{"n":"Jamaica Blue Mountain（Typica 系）","f":"坚果、奶油、柑橘、可可——四者高度均衡，没有任何一项突出","p":"水洗，且是法定唯一工艺。严格的发酵时长与晾晒管理，是那份「无瑕疵」平衡感的制度保障。","r":"中浅～中焙 · Agtron 68–58，一爆后发展 90–120 秒","note":"平衡是它唯一的卖点，任何一端的极端烘焙都会打破它；中焙最能体现那份奶油般的顺滑。只有蓝山山脉法定边界内、海拔 910–1700 m 的咖啡才能叫 Jamaica Blue Mountain，并强制木桶包装出口。"},{"n":"Typica 老树","f":"温润花香与坚果甜","p":"水洗。牙买加的 Typica 血统纯度高，是加勒比老种的活样本。","r":"中浅焙 · Agtron 68–58"}],"tags":["坚果","奶油","柑橘","可可","极致平衡"],"cup":"它的特点就是「没有特点」——酸、甜、苦、醇厚度四者高度均衡，没有任何一项突出。入口柔滑如奶油，坚果与可可的甜，尾韵干净不留苦。争议在于价格是否配得上这份克制。","process":[{"n":"水洗","lvl":"唯一标准","why":"法定工艺。严格的发酵时长与晾晒管理，是那份「无瑕疵」平衡感的制度保障。"}],"roast":{"n":"中浅 – 中焙","range":"Agtron 68 – 58｜一爆后发展 90–120 秒","why":"平衡是它唯一的卖点，任何一端的极端烘焙都会打破它。中焙最能体现那份奶油般的顺滑。"},"radar":{"acid":3,"body":4,"sweet":4,"aroma":3,"clean":5}},{"id":"kona","cn":"科纳","en":"Kona","zone":"夏威夷大岛西坡 Kona 咖啡带","country":"美国·夏威夷","iso":"USA","flag":"🇺🇸","group":"camerica","lon":-155.93,"lat":19.55,"alt":"250 – 900 m","harvest":"8 月 – 次年 1 月","climate":{"rain":"1000 – 1800 mm","temp":"18 – 27 ℃","soil":"年轻多孔玄武岩风化土，排水极快","text":"科纳咖啡带是一条宽仅 3 km、长约 40 km 的窄坡。特殊之处在于每日的固定节奏：上午晴朗日照，午后来自海面的云层准时遮住阳光形成天然遮荫，夜晚凉爽。这套「云的时刻表」补偿了它偏低的海拔——这也是全球极少数在 500 m 就能产出精品咖啡的地方。","note":"市面大量「Kona Blend」实际只含 10% 科纳豆，认准 100% Kona。"},"varieties":[{"n":"Kona Typica","f":"焦糖、澳洲坚果、黄油般顺滑，几乎没有苦味","p":"水洗，配合当地严格分级（Extra Fancy / Fancy / No.1）。少量小农做日晒，果味与甜度更浓。","r":"中焙 · Agtron 62–52，一爆后发展 100–130 秒","note":"低海拔豆（250–900 m）密度不高，浅焙容易发涩发青，中焙才能把焦糖与坚果的圆润完整表达。市面大量「Kona Blend」实际只含 10% 科纳豆，认准 100% Kona。"},{"n":"Caturra / Catuai","f":"柑橘与甜感","p":"水洗。","r":"中焙 · Agtron 64–54"}],"tags":["焦糖","澳洲坚果","黄油","柑橘","顺滑"],"cup":"温和顺滑得像加了黄油。焦糖与澳洲坚果的甜香贯穿全程，柑橘酸极淡，body 中等偏厚，几乎没有苦味。产量稀少加上美国本土人工成本，价格居高不下。","process":[{"n":"水洗","lvl":"标志","why":"科纳主流工艺，配合当地严格分级（Extra Fancy / Fancy），品质稳定。"},{"n":"日晒","lvl":"少量","why":"小农精品批次，果味与甜度更浓。"}],"roast":{"n":"中焙","range":"Agtron 62 – 52｜一爆后发展 100–130 秒","why":"低海拔豆密度不高，浅焙容易发涩发青。中焙才能把焦糖与坚果的圆润完整表达。"},"radar":{"acid":2,"body":4,"sweet":4,"aroma":3,"clean":4}},{"id":"gayo","cn":"迦佑（亚齐）","en":"Gayo Highlands","zone":"苏门答腊北部·塔肯贡 Takengon","country":"印度尼西亚","iso":"IDN","flag":"🇮🇩","group":"asia","lon":96.85,"lat":4.63,"alt":"1100 – 1600 m","harvest":"全年可采｜主产季 10 月 – 次年 2 月","climate":{"rain":"1800 – 2500 mm（几乎无明显旱季）","temp":"17 – 26 ℃","soil":"火山灰壤，深厚肥沃、有机质极高","text":"苏门答腊北端的高地湖区，赤道热带雨林气候意味着全年都在下雨——这恰恰是印尼独有处理法诞生的原因：没有连续晴天可用来正常晾晒，只好把豆子在半干状态下就脱壳。亚齐同时是全球有机咖啡认证面积最大的产区之一。"},"varieties":[{"n":"Ateng / Tim Tim（Catimor 系）","f":"雪松、草本、黑巧克力，body 厚得像糖浆","p":"湿刨法 Giling Basah——印尼独有：果实去皮发酵后，在含水率仍高达 30–50% 时就脱去羊皮层，再摊开续晒。这道工序让豆体呈深绿色、细胞结构松散，是苏门答腊低酸厚体与木质草本调的唯一成因。","r":"中～中深焙 · Agtron 58–45，一爆后发展 120–160 秒","note":"湿刨豆密度不均、含水率特殊，浅焙极易出青涩草味；往中深走能把木质香转成醇厚的黑巧。Tim Tim 即 Timor Timur，源自东帝汶的 Hibrido de Timor 后代。"},{"n":"Gayo 1 / Gayo 2","f":"甜感与稳定度，可可与坚果","p":"湿刨为主。本地选育的抗病种，是亚齐产量的骨干。","r":"中焙 · Agtron 55–46"},{"n":"Bourbon / Typica 老树（少量）","f":"柑橘与蜂蜜，酸质清晰","p":"水洗。精品批次的尝试，干净度大幅提升——但也就失去了「苏门答腊味」，属于取舍。","r":"浅中焙 · Agtron 72–60"}],"tags":["雪松","草本","黑巧克力","烟草","低酸厚体"],"cup":"典型的苏门答腊性格，但比林东干净。雪松与草本的木质香，黑巧与烟草的沉稳中段，酸度极低，body 厚得像糖浆。喜欢的人上瘾，不喜欢的人觉得像中药。","process":[{"n":"湿刨法 Giling Basah","lvl":"标志","why":"印尼独有：果实去皮发酵后，在含水率仍高达 30–50% 时就脱去羊皮层，再摊开续晒。这道工序让豆体呈深绿色、细胞结构松散，是苏门答腊低酸、厚体、木质草本调的唯一成因。"},{"n":"水洗","lvl":"少量","why":"精品批次尝试，酸质与干净度大幅提升，但也就失去了「苏门答腊味」。"}],"roast":{"n":"中 – 中深焙","range":"Agtron 58 – 45｜一爆后发展 120–160 秒","why":"湿刨豆密度不均、含水率特殊，浅焙极易出青涩草味。往中深走能把木质香转化为醇厚的黑巧，也是它作为意式配方「厚度担当」的用法。"},"radar":{"acid":1,"body":5,"sweet":3,"aroma":4,"clean":2}},{"id":"lintong","cn":"林东","en":"Lintong","zone":"苏门答腊·多巴湖西南岸","country":"印度尼西亚","iso":"IDN","flag":"🇮🇩","group":"asia","lon":98.98,"lat":2.28,"alt":"1200 – 1600 m","harvest":"全年可采｜主产季 5 – 12 月","climate":{"rain":"1800 – 2200 mm","temp":"17 – 26 ℃","soil":"多巴火山口湖周边的火山灰壤，钾含量高","text":"多巴湖是史前超级火山喷发留下的巨型破火山口，湖周高地的火山灰土层深厚得惊人。林东的名气建立在「曼特宁」这个商业名称上——严格说曼特宁指的是苏门答腊北部一带的湿刨阿拉比卡，而林东是其中品质公认最高的核心带。"},"varieties":[{"n":"Typica 系老种（Djember / Sidikalang）","f":"黑巧、泥土、雪松、香料，糖浆般的 body","p":"湿刨法。林东传统上发酵更久、晾晒更慢，泥土与香料感因此比亚齐更浓。","r":"中深～深焙 · Agtron 50–40，一爆后发展 140–180 秒","note":"林东是少数适合走到二爆边缘的单品豆：深焙把泥土香转成醇苦的黑巧，同时压掉杂味——传统曼特宁的经典烘法。"},{"n":"Ateng（Catimor 系）","f":"body 极厚，草本与可可","p":"湿刨。高产，是商业曼特宁的主力。","r":"中深焙 · Agtron 50–42"},{"n":"Onan Ganjang","f":"香料与甜感，比 Ateng 干净","p":"湿刨；少量做水洗时会显出意外的柑橘酸。","r":"中焙 · Agtron 54–46"},{"n":"「黄金曼特宁」分级","f":"杂味极少、body 依旧厚重，黑巧与雪松","p":"湿刨，但关键在处理之后：经过三次以上人工手选，把破损豆、虫蛀豆、贝壳豆逐颗挑掉。","r":"中深焙 · Agtron 52–42","note":"不是品种，是日本商社（PWN 等）建立的手选分级标准。同样的林东湿刨豆，挑得越干净卖得越贵——「黄金」指的是挑豆工序，不是某个庄园或树种。"}],"tags":["黑巧克力","泥土","雪松","香料","糖浆body"],"cup":"曼特宁的原点。干香是泥土与雪松，入口几乎没有酸，取而代之的是糖浆般厚重的 body、黑巧与香料，尾韵带一丝草药苦甜。是「醇厚度」这个词最好的教具。","process":[{"n":"湿刨法 Giling Basah","lvl":"标志","why":"和迦佑同源的工艺，但林东传统上发酵更久、晾晒更慢，风味的泥土与香料感因此更浓。"},{"n":"陈年豆 Aged","lvl":"传统特色","why":"仓储陈放数年，酸度进一步下降、body 更黏稠，带出木质与烟草的老熟感。"}],"roast":{"n":"中深 – 深焙","range":"Agtron 50 – 40｜一爆后发展 140–180 秒","why":"林东是少数适合走到二爆边缘的单品豆。深焙把泥土香转成醇苦的黑巧，同时压掉杂味——传统曼特宁的经典烘法。"},"radar":{"acid":1,"body":5,"sweet":3,"aroma":4,"clean":2}},{"id":"toraja","cn":"托拉贾","en":"Toraja","zone":"苏拉威西岛中部高地","country":"印度尼西亚","iso":"IDN","flag":"🇮🇩","group":"asia","lon":119.9,"lat":-2.97,"alt":"1400 – 1900 m","harvest":"5 月 – 11 月","climate":{"rain":"1500 – 2200 mm","temp":"16 – 25 ℃","soil":"火山灰壤，排水较苏门答腊好","text":"苏拉威西的山地比苏门答腊更陡、排水更好，晾晒条件也相对有利，因此同样用湿刨法，托拉贾的干净度却明显高一档。这里的 Tongkonan 船形屋与丧葬文化，让它成为少数「风景比咖啡更出名」的产区。"},"varieties":[{"n":"S795","f":"香料、黑巧、圆润 body，带一点黑醋栗的暗果酸","p":"湿刨法，但苏拉威西山地排水更好、晾晒条件更有利，做出的干净度明显高过苏门答腊。","r":"中～中深焙 · Agtron 56–45，一爆后发展 120–160 秒","note":"印度选育的老种（Kent × S288），二战后引入印尼，是托拉贾最主要的阿拉比卡。因干净度更高，可以比林东烘得略浅，保留那点暗果酸。"},{"n":"Jember（Typica 系）","f":"厚实与甜感，雪松尾韵","p":"湿刨为主。","r":"中焙 · Agtron 56–48"},{"n":"水洗托拉贾批次","f":"酸质与甜感被解放，柑橘与红糖","p":"水洗。这是了解苏拉威西风土的另一扇窗——同一片山，换个处理法完全是另一支豆。","r":"浅中焙 · Agtron 72–60"}],"tags":["黑巧克力","香料","雪松","黑醋栗","圆润"],"cup":"苏门答腊风格的精修版。同样是低酸厚体，但杂味少得多，黑巧与香料之外还能尝到一点黑醋栗的暗果酸，口感圆润干净。","process":[{"n":"湿刨法 Giling Basah","lvl":"标志","why":"印尼共通工艺，配合更好的晾晒条件，做出比苏门答腊更干净的厚体。"},{"n":"水洗","lvl":"推荐","why":"托拉贾的水洗批次相当出色，酸质与甜感被解放，是了解苏拉威西风土的另一扇窗。"}],"roast":{"n":"中 – 中深焙","range":"Agtron 56 – 45｜一爆后发展 120–160 秒","why":"和曼特宁同理，但因干净度更高，可以比林东烘得略浅一点，保留那点暗果酸。"},"radar":{"acid":2,"body":5,"sweet":4,"aroma":4,"clean":3}},{"id":"kintamani","cn":"金塔马尼","en":"Kintamani","zone":"巴厘岛·巴图尔火山周边","country":"印度尼西亚","iso":"IDN","flag":"🇮🇩","group":"asia","lon":115.36,"lat":-8.25,"alt":"1000 – 1500 m","harvest":"5 月 – 10 月","climate":{"rain":"1500 – 2000 mm","temp":"18 – 26 ℃","soil":"巴图尔火山灰壤，疏松富矿","text":"巴厘的咖啡种在火山口周边，最独特的是当地 Subak Abian 传统农社制度——它以印度教哲学为基础规范灌溉与种植，并禁止使用化学农药，同时强制柑橘与咖啡间作。橘树的存在被普遍认为是金塔马尼那股柑橘调的来源。"},"varieties":[{"n":"Typica / Bourbon 系","f":"橘子、柠檬、花香，红糖甜垫底","p":"完全水洗——这是金塔马尼与其他印尼产区最大的分歧点：这里不做湿刨，柑橘酸与花香才得以保留。","r":"浅中焙 · Agtron 74–62，一爆后发展 70–100 秒","note":"当地 Subak Abian 农社制度以印度教哲学规范种植，禁用化学农药并强制柑橘与咖啡间作——橘树被普遍认为是那股柑橘调的来源。"},{"n":"Kartika","f":"甜感稳定，可可与坚果","p":"水洗。本地选育的 Catimor 系，产量可靠。","r":"中浅焙 · Agtron 68–58"},{"n":"麝香猫咖啡 Kopi Luwak","f":"酸度极低、body 厚，泥土与霉香，风味争议极大","p":"经麝香猫消化道发酵后取出洗净晾晒。野生采集产量极小，市面绝大多数来自笼养——存在明确的动物福利问题，且笼养豆品质普遍低于普通精品批次。","r":"中深焙 · Agtron 52–44","note":"列在这里是因为它确实出自这片产区，但从性价比与伦理两方面看都不推荐；同样的钱买高海拔水洗批次是更好的选择。"}],"tags":["橘子","柠檬","花香","红糖","清爽"],"cup":"印尼里的异类——不厚不闷，反而清爽明亮。橘子与柠檬的酸带着花香，红糖甜垫底，body 轻盈干净。跟曼特宁完全是两个物种。","process":[{"n":"水洗","lvl":"标志","why":"金塔马尼与其他印尼产区最大的分歧点：这里做完全水洗而非湿刨，柑橘酸与花香才得以保留。"},{"n":"日晒","lvl":"少量","why":"小批次尝试，果甜更浓。"}],"roast":{"n":"浅中焙","range":"Agtron 74 – 62｜一爆后发展 70–100 秒","why":"柑橘与花香是它区别于印尼同侪的全部资本，深烘等于自毁特色。"},"radar":{"acid":4,"body":3,"sweet":4,"aroma":4,"clean":4}},{"id":"yunnan","cn":"云南（保山·普洱）","en":"Yunnan","zone":"保山、普洱、临沧、德宏","country":"中国","iso":"CHN","flag":"🇨🇳","group":"asia","lon":100.2,"lat":23.6,"alt":"900 – 1800 m","harvest":"11 月 – 次年 3 月","climate":{"rain":"1000 – 1600 mm（干湿季分明）","temp":"15 – 25 ℃","soil":"红壤与砖红壤，酸性、铁铝含量高","text":"横断山脉与澜沧江河谷造就了大量适宜的坡地，纬度虽偏北但海拔补足，加上冬季干燥少雨——采收与晾晒期天气条件甚至优于多数东南亚产区。产业从 1990 年代的雀巢订单起步，2015 年后精品化速度极快，如今已是亚洲最值得关注的新兴产区。"},"varieties":[{"n":"卡蒂姆 Catimor（主力）","f":"坚果、可可，body 扎实，处理不当会有明显青涩感","p":"水洗最稳——干燥的采收季让发酵与晾晒可控，干净度稳定。近年日晒与厌氧是精品批次的主战场，能显著提升甜感与果味层次。","r":"浅中～中焙 · Agtron 72–58，一爆后发展 80–120 秒","note":"卡蒂姆是 Timor Hybrid × Caturra 的抗锈种，1990 年代随雀巢订单大规模推广，风味上限有限但产量稳定。它的青涩感需要足够发展来消解，这是云南豆最常见的烘焙难点。"},{"n":"铁皮卡 / 波旁老种","f":"花香与柔和酸，蜂蜜甜","p":"水洗保香；蜜处理能加厚 body。保山、德宏的老园还有存量，多做微批次。","r":"浅中焙 · Agtron 76–64。这类老种可以比卡蒂姆烘得浅，把花果调留住"},{"n":"瑰夏 / SL28（新引种）","f":"花香与柑橘，高甜","p":"水洗保香，厌氧增层次。近年高端微批次的主角，价格与国际接轨。","r":"极浅～浅焙 · Agtron 86–74"}],"tags":["坚果","红糖","可可","柑橘","甘蔗甜"],"cup":"近五年进步最快的产区之一。基础款是坚果与可可的稳妥路线，精品批次则能做出明显的柑橘酸、甘蔗甜与花香。厌氧与蜜处理的实验非常活跃。","process":[{"n":"水洗","lvl":"标志","why":"云南主流工艺，干燥的采收季让发酵与晾晒可控，干净度稳定。"},{"n":"日晒 / 厌氧","lvl":"精品主力","why":"近年精品批次的主战场，能显著提升甜感与果味层次，是云南摆脱「商业豆」标签的关键手段。"}],"roast":{"n":"浅中 – 中焙","range":"Agtron 72 – 58｜一爆后发展 80–120 秒","why":"卡蒂姆种的青涩感需要足够发展来消解；精品批次的花果调则可以烘更浅。按品种分开对待是关键。"},"radar":{"acid":3,"body":4,"sweet":4,"aroma":3,"clean":4}},{"id":"daklak","cn":"多乐 / 邦美蜀","en":"Đắk Lắk (Buôn Ma Thuột)","zone":"越南中部高原","country":"越南","iso":"VNM","flag":"🇻🇳","group":"asia","lon":108.05,"lat":12.68,"alt":"500 – 800 m","harvest":"10 月 – 次年 1 月","climate":{"rain":"1600 – 2000 mm（旱季分明）","temp":"20 – 30 ℃","soil":"玄武岩风化红土（basalt），深厚肥沃","text":"中部高原的玄武岩红土配上高温、充沛降雨与明确旱季——这套条件对阿拉比卡而言太热，对罗布斯塔却是完美。越南凭此在三十年内成为世界第二大咖啡出口国、罗布斯塔的全球第一产地。近年高海拔的林同省一带才开始发展阿拉比卡精品。"},"varieties":[{"n":"Robusta（主力）","f":"黑巧、烤坚果、谷物，浓烈厚重，咖啡因约为阿拉比卡的两倍","p":"日晒。旱季采收让大规模日晒成为最经济的选择，也造就了浓厚的谷物与巧克力调。","r":"中深～深焙 · Agtron 48–38，一爆后发展 150–190 秒","note":"罗布斯塔的价值在浓度、油脂与冲击力，深焙把这些推满，也压掉生青的橡胶味——意式拼配里用来加 crema 与厚度。滴滤壶配炼乳的越南喝法就是为它设计的。"},{"n":"精品罗布斯塔 Fine Robusta","f":"焦糖、黑莓，杂味大幅减少","p":"水洗，配合成熟度分选与控温发酵。这是让罗豆摆脱橡胶与谷物味的关键工艺。","r":"中焙 · Agtron 56–46。做浅一点才能尝到它被解放出来的甜"},{"n":"Culi（圆豆）","f":"更集中的浓度与苦韵","p":"日晒。指单颗果实只结一粒的圆豆，密度更高、受热更均匀。","r":"中深焙 · Agtron 50–42","note":"不是品种，是按豆形筛出的分级，罗豆与阿拉比卡都有。"},{"n":"Catimor（少量阿拉比卡）","f":"坚果与可可","p":"水洗。多在林同省等高海拔带，是越南阿拉比卡精品化的起点。","r":"中焙 · Agtron 62–52"}],"tags":["黑巧克力","烤坚果","焦糖","谷物","浓烈"],"cup":"强烈、厚重、油脂丰沛。黑巧与烤坚果的重量感，几乎没有酸，咖啡因带来明显的苦韵与冲击力。滴滤壶配炼乳的越南咖啡就是为这支豆量身设计的喝法。","process":[{"n":"日晒","lvl":"标志","why":"旱季采收让大规模日晒成为最经济的选择，也造就了罗布斯塔浓厚的谷物与巧克力调。"},{"n":"水洗（精品罗）","lvl":"新兴","why":"Fine Robusta 的关键工艺，能大幅去除橡胶与谷物杂味，做出干净的焦糖甜。"}],"roast":{"n":"中深 – 深焙","range":"Agtron 48 – 38｜一爆后发展 150–190 秒","why":"罗布斯塔的价值在浓度、油脂与冲击力，深焙把这些推满，也压掉生青的橡胶味。意式拼配里用来加 crema 与厚度。"},"radar":{"acid":1,"body":5,"sweet":3,"aroma":2,"clean":2}},{"id":"chikmagalur","cn":"奇克马加卢尔","en":"Chikmagalur & Coorg","zone":"卡纳塔卡邦·西高止山脉","country":"印度","iso":"IND","flag":"🇮🇳","group":"asia","lon":75.77,"lat":13.32,"alt":"1000 – 1600 m","harvest":"11 月 – 次年 2 月","climate":{"rain":"1500 – 2500 mm（西南季风主导）","temp":"16 – 28 ℃","soil":"红壤与腐殖质，林下遮荫种植","text":"印度咖啡的起点——传说 17 世纪苏菲圣人 Baba Budan 从也门带回七颗豆子种在这片山上。西高止山的咖啡几乎全部是遮荫种植，与胡椒、豆蔻、肉桂间作，这套香料共生系统直接写进了杯中的风味。","note":"季风马拉巴（Monsooned Malabar）是印度独有：把日晒豆在西南季风期摊放于通风仓库，吸潮膨胀成灰白色，酸度几乎归零。"},"varieties":[{"n":"S795","f":"黑胡椒、豆蔻、可可、雪松，酸度低、body 厚","p":"水洗（当地称 Plantation A），把香料调理得干净有序。西高止山的咖啡几乎全是遮荫种植，与胡椒、豆蔻间作——那套香料共生系统直接写进了杯里。","r":"中～中深焙 · Agtron 55–44，一爆后发展 130–170 秒","note":"Kent × S288 的选育种，1940 年代由印度中央咖啡研究所发布，是印度阿拉比卡的骨干，也是托拉贾等东南亚产区的祖辈。"},{"n":"Sln.9","f":"花香与甜感更明显，柑橘尾韵","p":"水洗。S.795 × Tafarikela（埃塞血统）的选育种，杯测表现是印度品种里最好的之一。","r":"中浅焙 · Agtron 62–52"},{"n":"季风马拉巴 Monsooned Malabar","f":"完全无酸、木质与麦芽，豆体灰白膨胀","p":"季风处理：先日晒，再把豆子在西南季风期（6–9 月）摊放于通风仓库反复吸潮，持续数周。这是世界独一份的工艺。","r":"中～中深焙 · Agtron 55–42。豆子密度极低，火力要大幅降低，否则外层直接烤焦","note":"不是品种，是处理法。原本是帆船时代长途海运意外造成的效果——咖啡在潮湿船舱里数月，到岸时已变成这个样子；后来印度人把它制度化保留了下来。"},{"n":"Kaapi Royale（Robusta）","f":"浓厚顺滑，可可与烟草","p":"水洗。印度高品质罗豆的代表，是不少意式配方的隐藏基底。","r":"中深焙 · Agtron 50–42"}],"tags":["黑胡椒","豆蔻","可可","雪松","低酸"],"cup":"香料是它的签名。黑胡椒与豆蔻的辛香从干香一路延伸到尾韵，可可与雪松打底，酸度低、body 厚。季风马拉巴批次更极端——完全无酸、木质与麦芽感，像被时间泡过。","process":[{"n":"水洗","lvl":"标志","why":"印度主流工艺（当地称 Plantation A），把香料调理得干净有序。"},{"n":"季风处理 Monsooned","lvl":"独门绝技","why":"世界独一份：季风湿气让豆体吸潮膨胀、酸度归零，形成木质麦芽的独特风味。原本是帆船时代长途海运意外造成的效果，后来被制度化保留下来。"}],"roast":{"n":"中 – 中深焙","range":"Agtron 55 – 44｜一爆后发展 130–170 秒","why":"低酸厚体加香料调，深走能把可可与雪松托满。季风豆密度极低，需大幅降低火力避免烤焦。"},"radar":{"acid":1,"body":5,"sweet":3,"aroma":4,"clean":3}},{"id":"png-waghi","cn":"瓦吉谷","en":"Wahgi Valley","zone":"西高地省 Mt. Hagen 一带","country":"巴布亚新几内亚","iso":"PNG","flag":"🇵🇬","group":"asia","lon":144.3,"lat":-5.86,"alt":"1400 – 1900 m","harvest":"4 月 – 9 月","climate":{"rain":"2000 – 2800 mm","temp":"14 – 26 ℃","soil":"火山灰壤，有机质极厚","text":"咖啡由 1930 年代从牙买加蓝山引入的 Typica 种起家，至今仍是主力品种——PNG 因此保有全球最纯粹的老 Typica 基因库之一。绝大多数产自「garden coffee」：农户在自家园子里种几十棵树，手工采摘处理，规模小到近乎家庭作业。"},"varieties":[{"n":"Blue Mountain Typica","f":"柑橘、热带水果、焦糖，口感丝滑","p":"水洗。农户用小型手摇去皮机配溪水发酵，方式原始，干净度却出人意料地好。","r":"浅中～中焙 · Agtron 70–58，一爆后发展 90–120 秒","note":"1930 年代从牙买加蓝山引种的 Typica，至今仍是主力——巴新因此保有全球最纯粹的老 Typica 基因库之一。这是「蓝山血统在别处会长成什么样」的最佳样本。"},{"n":"Arusha / Bourbon","f":"甜厚与平衡，红糖尾韵","p":"水洗；部分批次做日晒，果甜更厚但一致性差。","r":"中焙 · Agtron 64–54"},{"n":"Mundo Novo / Catimor","f":"body 稳定，可可与坚果","p":"水洗。产量补充用。","r":"中焙 · Agtron 62–52"}],"tags":["柑橘","热带水果","焦糖","雪松","丝滑"],"cup":"意外的明亮。柑橘与热带水果的酸清晰，焦糖甜居中，尾韵有雪松与一点野性土壤味，口感丝滑。是「蓝山血统在别处会变成什么样」的最佳样本。","process":[{"n":"水洗","lvl":"标志","why":"农户小型手摇去皮机 + 溪水发酵的传统方式，干净度出人意料地好。"},{"n":"日晒","lvl":"少量","why":"部分批次尝试，果甜更厚但一致性差。"}],"roast":{"n":"浅中 – 中焙","range":"Agtron 70 – 58｜一爆后发展 90–120 秒","why":"Typica 的甜感需要一点发展，同时保住柑橘与热带水果的亮度。"},"radar":{"acid":4,"body":4,"sweet":4,"aroma":4,"clean":4}},{"id":"timor","cn":"埃尔梅拉","en":"Ermera","zone":"东帝汶中西部山区","country":"东帝汶","iso":"TLS","flag":"🇹🇱","group":"asia","lon":125.4,"lat":-8.75,"alt":"1000 – 1800 m","harvest":"5 月 – 9 月","climate":{"rain":"1500 – 2000 mm","temp":"16 – 26 ℃","soil":"火山与石灰岩混合壤","text":"咖啡占东帝汶非石油出口的绝大部分，几乎全是野放式的有机种植——不施肥、不打药，很多咖啡树就长在半野生的遮荫林里。这里还是咖啡遗传史上的关键地点：阿拉比卡与罗布斯塔的天然杂交种 Hibrido de Timor 在此被发现，后来成为全球抗叶锈育种（Catimor、Sarchimor 等）的共同祖先。"},"varieties":[{"n":"Hibrido de Timor（HdT）","f":"可可、青草与草本，body 厚实","p":"水洗。合作社水洗站是提升东帝汶品质的核心基础设施，能把野放咖啡的杂味压到最低。","r":"中浅～中焙 · Agtron 68–56，一爆后发展 90–120 秒","note":"咖啡遗传史上的关键：这是阿拉比卡与罗布斯塔在东帝汶的天然杂交种，1927 年被发现，后来成为全球抗叶锈育种（Catimor、Sarchimor 等）的共同祖先。它带罗豆血统，需要一点发展来消解草本涩感。"},{"n":"Typica 老树","f":"温和花香与柑橘","p":"水洗保香。多长在半野生的遮荫林里，几乎零投入。","r":"浅中焙 · Agtron 72–62"},{"n":"Catimor","f":"坚果与可可，甜感稳定","p":"水洗；农户自晒的日晒批次甜厚但一致性差。","r":"中焙 · Agtron 64–54"}],"tags":["可可","青草","柑橘","红糖","质朴"],"cup":"质朴而干净。可可与红糖的甜，柑橘的柔和酸，中段常有一缕青草与草本香。不惊艳，但对得起它近乎零投入的种植方式。","process":[{"n":"水洗","lvl":"标志","why":"合作社水洗站是提升东帝汶品质的核心基础设施，把野放咖啡的杂味压到最低。"},{"n":"日晒","lvl":"传统","why":"农户自晒的传统做法，甜厚但一致性差。"}],"roast":{"n":"中浅 – 中焙","range":"Agtron 68 – 56｜一爆后发展 90–120 秒","why":"Hibrido de Timor 带有罗布斯塔血统，需要一点发展来消解草本涩感，中焙最讨喜。"},"radar":{"acid":3,"body":4,"sweet":4,"aroma":3,"clean":3}},{"id":"doichaang","cn":"象山 / 清莱","en":"Doi Chaang","zone":"清莱府山区","country":"泰国","iso":"THA","flag":"🇹🇭","group":"asia","lon":99.6,"lat":19.8,"alt":"1000 – 1600 m","harvest":"11 月 – 次年 3 月","climate":{"rain":"1200 – 1800 mm（旱季分明）","temp":"15 – 28 ℃","soil":"山地红壤，腐殖质丰富","text":"泰北的咖啡产业源自 1970 年代皇家计划——用咖啡替代金三角的罂粟种植。Doi Chaang（象山）是这项替代作物计划最成功的案例：阿卡族村寨自建品牌，从种植到烘焙全链条自持，如今是泰国精品咖啡的代名词。"},"varieties":[{"n":"Catimor（主力）","f":"坚果、焦糖，甜感稳定","p":"水洗。旱季采收让水洗与晾晒都可控，是泰北品质稳定的基础。","r":"浅中～中焙 · Agtron 70–58，一爆后发展 90–120 秒","note":"与云南同理，卡蒂姆需要足够发展来消解青涩，同时保住柑橘的亮度。"},{"n":"Typica / Caturra","f":"柑橘与花香，茉莉尾韵","p":"水洗保香；蜜处理与厌氧是泰国庄园近年最活跃的实验方向，能显著加厚甜感与果味。","r":"浅中焙 · Agtron 74–62"},{"n":"Java / Geisha（微量）","f":"热带花香与佛手柑","p":"水洗。高端批次，产量极小。","r":"极浅～浅焙 · Agtron 86–76"}],"tags":["坚果","焦糖","柑橘","茉莉","柔和"],"cup":"柔和平衡的东南亚。坚果与焦糖打底，柑橘酸轻盈，尾韵偶有茉莉。近年精品批次的厌氧处理让它的果味层次上了一个台阶。","process":[{"n":"水洗","lvl":"标志","why":"旱季采收让水洗与晾晒都可控，是泰北品质稳定的基础。"},{"n":"蜜处理 / 厌氧","lvl":"精品主力","why":"泰国庄园在发酵实验上很活跃，能显著加厚甜感与果味。"}],"roast":{"n":"浅中 – 中焙","range":"Agtron 70 – 58｜一爆后发展 90–120 秒","why":"卡蒂姆种需要足够发展消解青涩，同时保住柑橘的亮度。"},"radar":{"acid":3,"body":4,"sweet":4,"aroma":3,"clean":4}},{"id":"bolaven","cn":"波罗芬高原","en":"Bolaven Plateau","zone":"占巴塞省·巴松 Paksong","country":"老挝","iso":"LAO","flag":"🇱🇦","group":"asia","lon":106.25,"lat":15.17,"alt":"1000 – 1350 m","harvest":"11 月 – 次年 3 月","climate":{"rain":"2500 – 3500 mm","temp":"16 – 26 ℃","soil":"玄武岩风化红土，极其肥沃","text":"波罗芬是一整块抬升的玄武岩高原，凉爽多雨、土壤肥沃到几乎不需施肥。咖啡由法国殖民者在 1920 年代引入，至今仍保留大量老树。产量小、知名度低，但风土条件在东南亚属于第一梯队。"},"varieties":[{"n":"Typica / Bourbon 老树","f":"蜂蜜、杏仁、柑橘，花香细致","p":"水洗。法国殖民者 1920 年代引入的老树至今仍在，产量少得可怜但品质扎实。","r":"浅中焙 · Agtron 76–62，一爆后发展 70–100 秒","note":"老树 Typica 值得烘浅保香，这是波罗芬最值得找的一类批次。"},{"n":"Catimor","f":"坚果与可可","p":"水洗；近年日晒与蜜处理的精品尝试明显加厚了甜感。","r":"中焙 · Agtron 64–54。需要更多发展来消解青涩"},{"n":"Robusta（低海拔带）","f":"厚实浓烈，黑巧与谷物","p":"日晒。老挝罗豆多用于速溶与拼配。","r":"中深焙 · Agtron 50–42"}],"tags":["蜂蜜","杏仁","柑橘","可可","干净"],"cup":"干净温和、甜感突出。蜂蜜与杏仁的甜，柑橘的柔酸，可可收尾。老树 Typica 批次的花香相当细致，只是产量少得可怜。","process":[{"n":"水洗","lvl":"标志","why":"合作社水洗站的标准流程，是老挝精品化的主要抓手。"},{"n":"日晒 / 蜜处理","lvl":"新兴","why":"近年精品批次尝试，甜感与果味明显加厚。"}],"roast":{"n":"浅中 – 中焙","range":"Agtron 72 – 58｜一爆后发展 80–110 秒","why":"老树 Typica 值得烘浅保香；Catimor 批次则需要更多发展来消解青涩。"},"radar":{"acid":3,"body":3,"sweet":4,"aroma":4,"clean":4}},{"id":"alishan","cn":"阿里山","en":"Alishan","zone":"嘉义县阿里山乡","country":"中国台湾","iso":"TWN","flag":"🇨🇳","group":"asia","lon":120.7,"lat":23.5,"alt":"800 – 1400 m","harvest":"11 月 – 次年 3 月","climate":{"rain":"2500 – 4000 mm","temp":"12 – 24 ℃","soil":"页岩与砂岩风化壤，排水好","text":"北回归线正好横穿这里，是咖啡带的最北缘。常年云雾与巨大日夜温差补偿了纬度劣势，但台风与人工成本是硬约束——产量极小、单价极高，走的完全是精品微批次路线。近年在国际杯测赛上屡有斩获。"},"varieties":[{"n":"Typica","f":"柑橘、乌龙茶感、细致花香，甜度扎实但不厚","p":"水洗最能呈现那股茶感与花香，是台湾庄园的主流选择。","r":"浅～浅中焙 · Agtron 80–68，一爆后发展 60–90 秒","note":"茶感与花香是核心特色，深烘会立刻变成平庸的焦糖味——浅焙是唯一合理的选择。"},{"n":"Geisha / SL34（少量）","f":"茉莉与热带水果","p":"水洗保香；蜜处理与厌氧的得奖批次多出于此，能叠出荔枝、蜜桃与酒香。","r":"极浅～浅焙 · Agtron 86–74"},{"n":"Catuai / Bourbon","f":"焦糖与平衡","p":"水洗；蜜处理增甜。","r":"浅中焙 · Agtron 74–62"}],"tags":["柑橘","乌龙茶感","焦糖","茉莉","细致"],"cup":"最具辨识度的是那股乌龙茶感——干净的柑橘酸、细致的花香、清爽的茶汤般口感，甜度扎实但不厚。产量小、价格高，属于「喝个稀奇」的类型，但完成度确实不低。","process":[{"n":"水洗","lvl":"标志","why":"呈现茶感与花香的最佳路径，也是台湾庄园的主流选择。"},{"n":"蜜处理 / 厌氧","lvl":"精品主力","why":"台湾庄园的实验非常精细，能叠出荔枝、蜜桃、酒香的层次，得奖批次多出于此。"}],"roast":{"n":"浅 – 浅中焙","range":"Agtron 80 – 68｜一爆后发展 60–90 秒","why":"茶感与花香是核心特色，深烘会立刻变成平庸的焦糖味。浅焙是唯一合理的选择。"},"radar":{"acid":4,"body":2,"sweet":4,"aroma":5,"clean":5}}];

  for (const [iso, c] of Object.entries(WORLD))
    h += `<path class="land${CISO.has(iso)?' c':''}" data-iso="${iso}" d="${c.d}"></path>`;
  lands.innerHTML = h;

  $('#zones').innerHTML = ZONES.map(z =>
    `<g class="zone" data-zone="${z.id}" style="color:${ZC[z.id]}">
       <rect x="${z.box[0]}" y="${z.box[1]}" width="${z.box[2]}" height="${z.box[3]}" rx=".6"/>
     </g>`).join('');
})();

/* 经纬网随视野加密：远看 10°，贴近产区细到 0.25° */
let gridStep = null;
function stepFor(w){
  return w > 150 ? 10 : w > 70 ? 5 : w > 28 ? 2 : w > 12 ? 1 : w > 5 ? .5 : .25;
}
function drawGrid(){
  const st = stepFor(cam.w);
  if (st === gridStep) return;
  gridStep = st;
  const majEvery = st >= 5 ? 3 : st >= 1 ? 5 : 4;
  let g = '';
  for (let i = 0, lon = -180; lon <= 180; lon += st, i++){
    const maj = i % majEvery === 0;
    g += `<line class="${maj?'major':''}" x1="${lon+180}" y1="0" x2="${lon+180}" y2="180"/>`;
  }
  for (let i = 0, lat = -84; lat <= 84; lat += st, i++){
    const maj = i % majEvery === 0;
    g += `<line class="${maj?'major':''}" x1="0" y1="${90-lat}" x2="360" y2="${90-lat}"/>`;
  }
  $('#grid').innerHTML = g;
}
drawGrid();

/* ---------- 相机 ---------- */
function resize(){
  const r = stage.getBoundingClientRect();
  SW = r.width; SH = r.height;
  svg.setAttribute('viewBox', `0 0 ${SW} ${SH}`);   // 用像素坐标系，内容层做变换
  apply();
}
function fit(box, opts={}){
  const [x,y,w,h] = box, asp = SW/SH;
  const pad = opts.pad ?? 1.0;
  const cw = Math.max(w, h*asp) * pad;
  return {cx:x + w/2 + (opts.dx||0)*cw,
          cy:y + h/2 + (opts.dy||0)*cw*(SH/SW), w:cw};
}
/* 地图坐标 -> 屏幕像素 */
function px(lon, lat){
  const k = SW / cam.w;
  return [ (lon + 180 - (cam.cx - cam.w/2)) * k,
           (90 - lat - (cam.cy - (SH/SW)*cam.w/2)) * k ];
}
function apply(){
  const k = SW / cam.w;
  const tx = -(cam.cx - cam.w/2) * k;
  const ty = -(cam.cy - (SH/SW)*cam.w/2) * k;
  $('#cam').setAttribute('transform', `translate(${tx} ${ty}) scale(${k})`);
  drawGrid();
  hud();
  positionLabels();
}
function dms(v, pos, neg){
  const d = Math.abs(v), deg = Math.floor(d), min = Math.round((d - deg) * 60);
  return `${deg}°${String(min).padStart(2,'0')}′${v >= 0 ? pos : neg}`;
}
function hud(){
  const lon = cam.cx - 180, lat = 90 - cam.cy;
  $('#hudpos').textContent = `${dms(lat,'N','S')}  ${dms(lon,'E','W')}`;
  // 等距圆柱投影下，经度方向的实际距离随纬度收缩
  const kmPerDeg = 111.32 * Math.cos(lat * Math.PI / 180);
  const target = SW * 0.085;                       // 比例尺目标像素长度
  const degs = target / (SW / cam.w);
  const km = degs * kmPerDeg;
  const nice = [1,2,5,10,20,50,100,200,500,1000,2000,5000];
  const pick = nice.reduce((a,b) => Math.abs(b - km) < Math.abs(a - km) ? b : a);
  $('#hudkm').textContent = pick + ' km';
  $('#hudbar').style.width = (pick / kmPerDeg) * (SW / cam.w) + 'px';
}
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
function flyTo(target, dur=900, done){
  if (REDUCE) dur = 0;
  if (anim) cancelAnimationFrame(anim.raf);
  if (dur <= 0){ Object.assign(cam, target); apply(); layoutLabels(); done && done(); return; }
  const from = {...cam}, t0 = performance.now();
  const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
  const step = now => {
    const t = Math.min(1, (now - t0)/dur), e = ease(t);
    cam.cx = from.cx + (target.cx - from.cx)*e;
    cam.cy = from.cy + (target.cy - from.cy)*e;
    cam.w  = from.w  * Math.pow(target.w/from.w, e);   // 对数缩放更自然
    apply();
    if (t < 1) anim.raf = requestAnimationFrame(step);
    else { anim = null; layoutLabels(); done && done(); }
  };
  anim = {raf:requestAnimationFrame(step)};
}

/* ---------- 标签层 ---------- */
let markers = [];
function renderLabels(){
  labels.innerHTML = '';
  markers = [];
  const worldOverview = view.level === 'world' && !activeTags.size;
  if (worldOverview){
    for (const z of ZONES){
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'zlab' + (z.anc === 'bl' ? ' bl' : ''); el.style.color = ZC[z.id];
      el.innerHTML = `<div class="zn">${z.cn}</div><div class="zs">${z.en}</div>
        <div class="zc">${REGIONS.filter(r=>r.group===z.id).length} 个产区</div>`;
      el.onclick = () => goZone(z.id);
      labels.appendChild(el);
      markers.push({el, lon:z.lab[0]-180, lat:90-z.lab[1], zone:true});
    }
  }
  {
    const list = view.level === 'world' || activeTags.size
      ? REGIONS : REGIONS.filter(r => r.group === view.zone);
    for (const r of list){
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'mk' + (worldOverview ? ' tiny' : '');
      el.style.color = ZC[r.group];
      el.innerHTML = `<div class="dot"></div><div class="nm">${r.cn}<em>${r.en}</em></div>`;
      el.setAttribute('aria-label', `${r.cn} — ${r.country}`);
      el.onclick = e => { e.stopPropagation(); goRegion(r.id); };
      labels.appendChild(el);
      markers.push({el, lon:r.lon, lat:r.lat, r});
    }
  }
  positionLabels();
  applyFilter();
  requestAnimationFrame(layoutLabels);
}
function positionLabels(){
  for (const m of markers){
    const [x,y] = px(m.lon, m.lat);
    const inside = x > 6 && x < SW - 6 && y > 6 && y < SH - 6;
    let ex = x, ey = y, edge = false;
    if (!inside && view.level === 'zone' && m.r && m.r.group === view.zone){
      ex = Math.min(Math.max(x, 22), SW - 22);
      ey = Math.min(Math.max(y, 22), SH - 22);
      edge = true;
    }
    m.el.classList.toggle('edge', edge);
    m.el.style.left = ex + 'px'; m.el.style.top = ey + 'px';
    const vis = edge || (x > -180 && x < SW + 180 && y > -80 && y < SH + 80);
    m.el.style.display = vis ? '' : 'none';
  }
}
/* 名称避让：贪心放置，冲突则换位，仍冲突则只留圆点 */
function layoutLabels(){
  const placed = [];
  const cands = [[10,-9],[10,4],[10,-22],[null,-9],[null,4],[null,-22],
                 [10,17],[null,17],[10,-35],[null,-35],[10,30],[null,30],
                 [22,-9],[22,10],[22,-28]];
  const PAD = 3;
  const ms = markers.filter(m => !m.zone && m.el.style.display !== 'none'
                              && !m.el.classList.contains('tiny'))
                    .sort((a,b) => a.el.offsetTop - b.el.offsetTop);
  // 先把所有圆点占住，名字宁可不显示也不压在别的产区上
  for (const m of markers.filter(m => !m.zone && m.el.style.display !== 'none'))
    placed.push({l:parseFloat(m.el.style.left) - 5, t:parseFloat(m.el.style.top) - 5,
                 r:parseFloat(m.el.style.left) + 5, b:parseFloat(m.el.style.top) + 5});
  for (const m of ms){
    const nm = m.el.querySelector('.nm');
    nm.style.display = ''; nm.style.left = ''; nm.style.top = '';
    const w = nm.offsetWidth, h = nm.offsetHeight;
    const x0 = parseFloat(m.el.style.left), y0 = parseFloat(m.el.style.top);
    let ok = false;
    for (const [dx, dy] of cands){
      const lx = dx === null ? x0 - w - 10 : x0 + dx, ly = y0 + dy;
      if (lx < 2 || lx + w > SW - 2 || ly < 2 || ly + h > SH - 2) continue;
      const box = {l:lx - PAD, t:ly - PAD, r:lx + w + PAD, b:ly + h + PAD};
      if (placed.some(p => !(box.r < p.l || box.l > p.r || box.b < p.t || box.t > p.b))) continue;
      nm.style.left = (dx === null ? -w - 10 : dx) + 'px';
      nm.style.top = dy + 'px';
      placed.push(box); ok = true; break;
    }
    if (!ok) nm.style.display = 'none';
  }
}

$('#zbtns').innerHTML = ZONES.map(z =>
  `<button data-z="${z.id}" style="color:${ZC[z.id]}"><i></i>${z.cn}</button>`).join('');
$('#zbtns').onclick = e => {
  const b = e.target.closest('button'); if (b) goZone(b.dataset.z);
};

/* ---------- 导航 ---------- */
function crumbs(){
  const c = $('#crumbs');
  let h = `<button data-nav="world">世界</button>`;
  if (view.zone){
    const z = ZONES.find(z=>z.id===view.zone);
    h += `<span class="sep">›</span>` + (view.region
      ? `<button data-nav="zone">${z.cn}</button>` : `<span class="cur">${z.cn}</span>`);
  }
  if (view.region){
    const r = REGIONS.find(r=>r.id===view.region);
    h += `<span class="sep">›</span><span class="cur">${r.cn}</span>`;
  }
  c.innerHTML = h;
  c.querySelectorAll('button').forEach(b => b.onclick = () =>
    b.dataset.nav === 'world' ? goWorld() : goZone(view.zone));
  const n = activeTags.size
    ? `${REGIONS.filter(matchTags).length} / ${REGIONS.length} 个产区匹配`
    : (view.zone ? `${REGIONS.filter(r=>r.group===view.zone).length} 个产区`
                 : `${REGIONS.length} 个产区 · 31 个国家`);
  $('#hcount').textContent = n;
  $('#back').classList.toggle('show', view.level !== 'world');
  $('#backtxt').textContent = view.region ? (ZONES.find(z=>z.id===view.zone)||{}).cn : '世界';
  $('#intro').classList.toggle('hide', view.level !== 'world' || activeTags.size > 0);
}
let hashLock = false;
function setHash(v){
  hashLock = true;
  location.hash = v ? '#' + v : '';
  setTimeout(() => hashLock = false, 0);
}
function goWorld(now){
  view = {level:'world', zone:null, region:null};
  closePanel(); crumbs(); renderLabels(); setHash('');
  flyTo(fit(WORLD_BOX, {dy: SH > SW ? .1 : 0}), now ? 0 : 900);
  highlight(null);
}
function goZone(id, now){
  view = {level:'zone', zone:id, region:null};
  closePanel(); crumbs(); renderLabels(); setHash(id);
  flyTo(fit(ZONES.find(z=>z.id===id).box, {pad:1.06}), now ? 0 : 950);
  highlight(id);
}
function goRegion(id, now){
  const r = REGIONS.find(r => r.id === id);
  view = {level:'region', zone:r.group, region:id};
  crumbs(); renderLabels(); setHash(id);
  markers.forEach(m => m.r && m.el.classList.toggle('sel', m.r.id === id));
  const pw = window.innerWidth > 860 ? panel.offsetWidth || SW * .3 : 0;
  const box = [r.lon + 180 - 4, 90 - r.lat - 3, 8, 6];
  flyTo(fit(box, {dx: pw / SW / 2}), now ? 0 : 1000);
  openPanel(r);
  highlight(r.group);
}
function highlight(zone){
  // USA 只因夏威夷科纳入列，整片高亮会误导，排除
  const isos = new Set(zone && view.level === 'zone'
    ? REGIONS.filter(r => r.group === zone && r.iso !== 'USA').map(r => r.iso) : []);
  document.querySelectorAll('.land').forEach(p =>
    p.classList.toggle('on', isos.has(p.dataset.iso)));
  const lv = view.level;
  $('#belt').style.opacity = lv === 'world' ? 1 : (lv === 'zone' ? .5 : .22);
  $('#zones').style.opacity = lv === 'world' ? 1 : .25;
  $('#fade').style.opacity = lv === 'world' ? 1 : (lv === 'zone' ? .45 : .2);
  $('#hud').hidden = lv === 'world';
  $('#hud').classList.toggle('left', lv === 'region');
  const zi = $('#zintro');
  zi.hidden = lv !== 'zone';
  if (lv === 'zone'){
    const z = ZONES.find(x => x.id === view.zone);
    zi.querySelector('.zt').textContent = z.en;
    zi.querySelector('.zt').style.color = ZC[z.id];
    zi.querySelector('p').textContent = ZTEXT[z.id];
  }
  $('#zones').style.pointerEvents = lv === 'world' ? '' : 'none';
}
$('#back').onclick = () => view.region ? goZone(view.zone) : goWorld();
$('#pclose').onclick = () => view.zone ? goZone(view.zone) : goWorld();
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') view.region ? goZone(view.zone) : (view.zone ? goWorld() : null);
});
$('#zones').addEventListener('click', e => {
  const g = e.target.closest('.zone'); if (g) goZone(g.dataset.zone);
});

/* ---------- 详情面板 ---------- */
function closePanel(){ panel.classList.remove('open'); }
function openPanel(r){
  const imgs = IMGS[r.id] || [];
  const ag = (r.roast.range.match(/Agtron\s*(\d+)\s*[–-]\s*(\d+)/) || []).slice(1).map(Number);
  let scale = '';
  if (ag.length === 2){
    const [hi, lo] = ag, L = 95, D = 25;
    const l = (L - hi)/(L - D)*100, w = (hi - lo)/(L - D)*100;
    scale = `<div class="scale"><div class="win" style="left:${l}%;width:${w}%"></div></div>
      <div class="scaleax"><span>Agtron 95 极浅</span><span>60 中焙</span><span>25 极深</span></div>`;
  }
  const bars = [['酸质','acid'],['醇厚','body'],['甜感','sweet'],['香气','aroma'],['干净度','clean']];
  const c = r.climate;

  $('#pbody').innerHTML = `
  ${imgs.length ? `<div class="phero" id="phero">
      <img src="${imgs[0].d}" alt="${imgs[0].cap}">
      <div class="pcap"><span id="pcaptxt">${imgs[0].cap}${imgs[0].tier===2?'<i class="ref">同国参考图</i>':''}</span>
      ${imgs.length>1?`<div class="pdots" id="pdots">${imgs.map((_,i)=>
        `<button class="${i?'':'on'}" data-i="${i}" aria-label="第 ${i+1} 张"></button>`).join('')}</div>`:''}</div>
    </div>` : ''}

  <div class="phead">
    <div class="pttl"><span class="pflag">${r.flag}</span><h2>${r.cn}</h2></div>
    <div class="pen">${r.en}</div>
    <div class="pzone">${r.country} · ${r.zone}</div>
  </div>

  <dl class="pfacts">
    <div><dt>海拔</dt><dd>${r.alt}</dd></div>
    <div><dt>采收期</dt><dd>${r.harvest}</dd></div>
    <div><dt>年降雨</dt><dd>${c.rain}</dd></div>
    <div><dt>年均温</dt><dd>${c.temp}</dd></div>
  </dl>

  <section>
    <h3>气候条件</h3>
    <div class="soil"><dt>土壤</dt><dd>${c.soil}</dd></div>
    <p class="body-t">${c.text}</p>
    ${c.note ? `<p class="body-t" style="color:var(--txt3);font-size:12.5px">※ ${c.note}</p>` : ''}
  </section>

  <section>
    <h3>特色豆种 · 各自的处理法与烘焙度</h3>
    ${r.varieties.map(v=>`<div class="var">
      <b>${v.n}</b>
      <div class="vf">${v.f}</div>
      <dl class="vm">
        <div><dt>处理</dt><dd>${v.p}</dd></div>
        <div><dt>烘焙</dt><dd>${v.r}</dd></div>
      </dl>
      ${v.note ? `<p class="vn">${v.note}</p>` : ''}
    </div>`).join('')}
    <div class="tags">${r.tags.map(t=>`<button class="tag" data-tag="${t}">${t}</button>`).join('')}</div>
    <p class="cup">${r.cup}</p>
    <div class="bars">${bars.map(([n,k])=>`
      <div class="bar" style="color:${ZC[r.group]}"><i>${n}</i>
        <u><b style="width:${r.radar[k]*20}%"></b></u><em>${r.radar[k]}/5</em></div>`).join('')}</div>
  </section>

  <section>
    <h3>产区主流处理法</h3>
    ${r.process.map(p=>`<div class="proc"><header><b>${p.n}</b>
      <span class="lvl${/标志|唯一|首选/.test(p.lvl)?'':' s'}">${p.lvl}</span></header>
      <p>${p.why}</p></div>`).join('')}
  </section>

  <section>
    <h3>产区通用烘焙度</h3>
    <div class="roast">
      <div class="rt"><b>${r.roast.n}</b><span>${r.roast.range}</span></div>
      ${scale}
      <p>${r.roast.why}</p>
    </div>
  </section>

  ${imgs.length ? `<div class="credit">图片来自 Wikimedia Commons，均为自由版权。${
    imgs.map(i=>`<br>· ${i.url?`<a href="${i.url}" target="_blank" rel="noopener">${i.src}</a>`:i.src}${
      i.by?` — ${i.by}`:''}${i.lic?`（${i.lic}）`:''}`).join('')}
    <br><br>标注「同国参考图」者为该国其他地点拍摄，仅作风土参考。</div>` : ''}
  `;
  panel.classList.add('open');
  $('#pbody').scrollTop = 0;
  moreHint();

  const dots = $('#pdots');
  if (dots) dots.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const im = imgs[+b.dataset.i];
    const img = $('#phero img');
    img.style.animation = 'none'; void img.offsetWidth; img.style.animation = '';
    img.src = im.d; img.alt = im.cap;
    $('#pcaptxt').innerHTML = im.cap + (im.tier===2?'<i class="ref">同国参考图</i>':'');
    dots.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  };
  $('#pbody').querySelectorAll('.tag').forEach(b =>
    b.onclick = () => toggleTag(b.dataset.tag, true));
}

function moreHint(){
  const pb = $('#pbody');
  panel.classList.toggle('more', pb.scrollHeight - pb.scrollTop - pb.clientHeight > 24);
}
$('#pbody').addEventListener('scroll', moreHint, {passive:true});
addEventListener('resize', moreHint);

/* ---------- 风味筛选 ---------- */
const TAGCOUNT = {};
REGIONS.forEach(r => r.tags.forEach(t => TAGCOUNT[t] = (TAGCOUNT[t]||0)+1));
const TOPTAGS = Object.entries(TAGCOUNT).sort((a,b)=>b[1]-a[1]).slice(0,11).map(x=>x[0]);
$('#filters').innerHTML = `<span style="color:var(--txt3);font-size:11px;letter-spacing:.1em">风味筛选</span>` +
  TOPTAGS.map(t=>`<button class="ftag" data-tag="${t}">${t}</button>`).join('');
$('#filters').onclick = e => {
  const b = e.target.closest('.ftag'); if (b) toggleTag(b.dataset.tag);
};
function matchTags(r){ return [...activeTags].every(t => r.tags.includes(t)); }
function toggleTag(t, fromPanel){
  activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t);
  document.querySelectorAll('.ftag').forEach(b =>
    b.classList.toggle('on', activeTags.has(b.dataset.tag)));
  if (fromPanel && activeTags.size){ closePanel(); view = {level:'world', zone:null, region:null}; }
  crumbs(); renderLabels(); applyFilter();
  if (activeTags.size && view.level === 'world') flyTo(fit(WORLD_BOX, {dy: SH > SW ? .1 : 0}), 700);
}
function applyFilter(){
  const on = activeTags.size > 0;
  markers.forEach(m => {
    if (!m.r) return;
    const ok = !on || matchTags(m.r);
    m.el.classList.toggle('dim', !ok);
    m.el.classList.toggle('flt', ok && on);
    if (on) m.el.classList.toggle('tiny', !ok);   // 落选的只留一个暗点，把名字让给匹配项
  });
}
/* ---------- 平移 / 缩放 ---------- */
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('#panel,.mk,.zlab,#back,#intro,#zbtns')) return;
  drag = {x:e.clientX, y:e.clientY, cx:cam.cx, cy:cam.cy, moved:0};
  stage.setPointerCapture(e.pointerId); stage.style.cursor = 'grabbing';
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const k = cam.w / SW;
  drag.moved += Math.abs(e.movementX) + Math.abs(e.movementY);
  cam.cx = drag.cx - (e.clientX - drag.x)*k;
  cam.cy = drag.cy - (e.clientY - drag.y)*k;
  apply();
});
stage.addEventListener('pointerup', () => {
  if (drag && drag.moved > 4) layoutLabels();
  drag = null; stage.style.cursor = '';
});
stage.addEventListener('wheel', e => {
  if (e.target.closest('#panel')) return;      // 详情面板要能正常滚动
  e.preventDefault();
  const k = Math.exp(e.deltaY * 0.0016);
  const nw = Math.min(400, Math.max(2.2, cam.w * k));
  const r = stage.getBoundingClientRect();
  const mx = (e.clientX - r.left)/SW - .5, my = (e.clientY - r.top)/SH - .5;
  cam.cx += mx * (cam.w - nw);
  cam.cy += my * (cam.w - nw) * (SH/SW);
  cam.w = nw; apply();
  clearTimeout(window._wt); window._wt = setTimeout(layoutLabels, 140);
}, {passive:false});

/* ---------- 启动：支持 #产区id 深链接 ---------- */
function fromHash(now){
  const h = decodeURIComponent(location.hash.slice(1));
  if (REGIONS.some(r => r.id === h)) goRegion(h, now);
  else if (ZONES.some(z => z.id === h)) goZone(h, now);
  else goWorld(now);
}
addEventListener('hashchange', () => { if (!hashLock) fromHash(false); });
addEventListener('resize', () => { resize(); layoutLabels(); });
resize();
cam = fit(WORLD_BOX, {dy: SH > SW ? .1 : 0});
crumbs(); renderLabels(); apply();
fromHash(true);
</script>
