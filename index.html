<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="胡静函的个人主页 —— 营养、科技、生活与热爱" />
    <meta name="author" content="Hujinghan" />
    <title>胡静函 | 个人主页</title>

    <!-- 花体：Dancing Script(拉丁) + Ma Shan Zheng(中文)
         正文：Noto Sans SC；标题衬线：Noto Serif SC + Cormorant Garamond(拉丁) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <script>
      // 首屏就应用主题，避免刷新时闪烁
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 还原 404.html 记下的 SPA 深链路径
      (function () {
        var r = sessionStorage.getItem('spa-redirect');
        if (r) {
          sessionStorage.removeItem('spa-redirect');
          if (r !== location.pathname + location.search + location.hash) {
            history.replaceState(null, '', r);
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
